<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Galaxy for Jaida 💖</title>
  <meta name="description" content="Interactive pink galaxy dedicated to Jaida 💖">
  <style>
    html, body { margin: 0; height: 100%; background: #0a0005; overflow: hidden; }
    #startBtn {
      display: block;
      transition: transform 0.18s cubic-bezier(.4,2,.6,1), box-shadow 0.18s;
      animation: pulseBtn 1.2s infinite cubic-bezier(.4,0,.6,1);
    }
    #startBtn:hover, #startBtn:focus {
      transform: scale(1.09);
      box-shadow: 0 0 32px 8px #ff70b899, 0 0 0 2px #fff2;
      outline: none;
    }
    @keyframes pulseBtn {
      0% { transform: scale(1); box-shadow: 0 0 0 0 #ff70b844; }
      60% { transform: scale(1.13); box-shadow: 0 0 32px 8px #ff70b899; }
      100% { transform: scale(1); box-shadow: 0 0 0 0 #ff70b844; }
    }
    #galaxy-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .error { position: fixed; inset: auto 10px 20px 10px; background: #260015; color: #ffd9f7; border: 1px solid #ff8ae5; border-radius: 10px; padding: 10px; font: 12px system-ui; display: none; z-index: 2000; }
  </style>

  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>

<!-- Start Modal -->
<div id="startModal" style="position:fixed;inset:0;z-index:1000;background:#0d0007;display:flex;align-items:center;justify-content:center;flex-direction:column;">
  <button id="startBtn" style="background:none;border:none;outline:none;cursor:pointer;padding:0;">
    <img src="https://i.postimg.cc/3rDGhH6M/snopie-j.png" alt="Start" style="width:270px;height:270px;display:block;border-radius:20px;border: 3px solid #ff70b8;">
  </button>
</div>

<audio id="bgMusic" src="https://github.com/Baque2005/Organizador/raw/refs/heads/master/Never%20Shout%20Never%20-%20Can't%20Stand%20ItLetra%20en%20espa%C3%B1ol.mp3" preload="auto"></audio>

<canvas id="galaxy-canvas"></canvas>
<div id="err" class="error"></div>
<canvas id="fx" style="position:fixed;inset:0;pointer-events:none;z-index:500;"></canvas>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const modal = document.getElementById('startModal');
  const btn = document.getElementById('startBtn');
  const music = document.getElementById('bgMusic');

  btn.addEventListener('click', function() {
    modal.style.display = 'none';
    music.volume = 0.7;
    const playPromise = music.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {});
    }
    runGalaxy({ cinematic: true });
  });

  function runGalaxy(opts = {}) {
    const err = document.getElementById('err');
    function showError(msg) { err.textContent = msg; err.style.display = 'block'; }

    try { 
      const test = document.createElement('canvas').getContext('webgl') || document.createElement('canvas').getContext('experimental-webgl');
      if (!test) throw new Error('WebGL is not enabled in your browser');
    } catch(e) { 
      showError('WebGL seems disabled. Please enable hardware acceleration.'); 
      return; 
    }

    try {
      const canvas = document.getElementById('galaxy-canvas');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; 
      controls.dampingFactor = 0.06;
      controls.minDistance = 10; 
      controls.maxDistance = 220;
      controls.target.set(0, 0, 0);

      let cinematicState = opts.cinematic ? 0 : null;
      let cinematicStart = null;
      const cinematicDuration1 = 2.2;
      const cinematicDuration2 = 3.5;
      const cinematicDuration3 = 2.2;
      const cinematicTotal = cinematicDuration1 + cinematicDuration2 + cinematicDuration3;

      function setCam() {
        const w = window.innerWidth, h = window.innerHeight;
        const isMobile = w < 768 || w < h;
        camera.fov = isMobile ? 90 : 75;
        camera.position.set(0, isMobile ? 26 : 22, isMobile ? 110 : 75);
        camera.updateProjectionMatrix(); 
        controls.update();
      }
      setCam();

      renderer.setClearColor(0x0a0005, 1);

      // Pink Light Explosions
      const explosions = [];
      function spawnExplosion() {
        const geo = new THREE.PlaneGeometry(60, 60);
        const c = document.createElement('canvas');
        c.width = c.height = 256;
        const g = c.getContext('2d');
        const grad = g.createRadialGradient(128, 128, 10, 128, 128, 128);
        grad.addColorStop(0, 'rgba(255,220,240,0.85)');
        grad.addColorStop(0.2, 'rgba(255,100,180,0.45)');
        grad.addColorStop(0.5, 'rgba(200,30,120,0.18)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, 256, 256);
        const tex = new THREE.CanvasTexture(c);
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
        const mesh = new THREE.Mesh(geo, mat);
        const angle = Math.random() * Math.PI * 2;
        const dist = 70 + Math.random() * 60;
        mesh.position.set(Math.cos(angle) * dist, (Math.random() - 0.5) * 40, Math.sin(angle) * dist);
        mesh.lookAt(0, 0, 0);
        mesh.material.opacity = 0.85;
        mesh.userData.life = 1.0;
        explosions.push(mesh);
        scene.add(mesh);
      }

      setInterval(() => { if (Math.random() < 0.85) spawnExplosion(); }, 700);

      const galaxy = new THREE.Group();
