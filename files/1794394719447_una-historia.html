<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8dce5">
<title>Una rosa cultivada para ti</title>
<style>
:root{--rose:#c72f59;--pink:#f7d8e2;--ink:#754257;--green:#4c8b56}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;
background:radial-gradient(circle at 50% 20%,#fffaf7,#f9e2e9 55%,#eec2d1);
font-family:Georgia,serif;color:var(--ink)}
.card{width:min(100%,520px);padding:28px 18px 24px;border:1px solid #fff;
border-radius:30px;background:#fff9f2e8;box-shadow:0 20px 60px #9d526b2b;text-align:center;overflow:hidden;position:relative}
.card:before{content:"";position:absolute;inset:10px;border:1px solid #e9bdca;border-radius:23px;pointer-events:none}
header,footer{position:relative;z-index:2}
.kicker{font:italic 13px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#b36d83}
h1{font-weight:normal;font-size:clamp(27px,7vw,36px);margin:9px 0 6px;color:#93425e}
.subtitle{margin:0;color:#a66b7f;font:14px Arial,sans-serif}
.stage{position:relative;width:100%;max-width:420px;height:420px;margin:4px auto 0}
svg{width:100%;height:100%;overflow:visible}
.ground{fill:#8dbe78}
.ground-shadow{fill:#5c985e;opacity:.15}
.soil{fill:#91604c}
.soil-light{fill:#b27b5d}
.bear-outline{stroke:#925d42;stroke-width:3;stroke-linejoin:round}
.fur{fill:url(#fur)}
.belly{fill:#f4d7bd}
.inner-ear{fill:#e9b4a4}
.eye{fill:#49312a}
.muzzle{fill:#f2d9c5}
.nose{fill:#54352f}
.cheek{fill:#e58c9a;opacity:.45}
.overall{fill:#7593a9;stroke:#557589;stroke-width:2}
.paw{fill:#d9a17c}
.plant-stem{fill:none;stroke:#397e4c;stroke-width:5;stroke-linecap:round}
.leaf{fill:#5d9c5e;stroke:#397e4c;stroke-width:1.5}
.petals{fill:#d82f5c;stroke:#a91f48;stroke-width:1.4}
.petals-light{fill:#f45c7e}
.center{fill:#f7c95e}
.stage-label{font:italic 16px Georgia,serif;fill:#99536c}
.scene-part{opacity:0;transition:opacity .7s ease}
#bear{transform-origin:210px 300px;transition:transform .8s ease}
#watering-can{transform-origin:144px 235px;opacity:0}
#seed{opacity:0}
#rosePlant{transform-origin:285px 310px}
#pickedRose{opacity:0;transform-origin:270px 245px}
#bear.offer{transform:translateX(-12px)}
#pickedRose.show{opacity:1;animation:present .9s ease-out both}
#rosePlant.hidden{opacity:0}
#watering-can.pour{opacity:1;animation:tilt .8s ease-in-out 2}
.sparkle{opacity:0;fill:#e7a1b6}
.sparkle.on{animation:twinkle 1.4s ease-in-out infinite}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0 0}
button{border:0;border-radius:28px;padding:12px 19px;font:15px Arial,sans-serif;cursor:pointer}
#play{background:linear-gradient(135deg,#d96e91,#b8446b);color:white;box-shadow:0 7px 18px #b8446b35}
#reset{background:#f5e3e9;color:#92536a}
button:active{transform:scale(.97)}
.story{min-height:53px;margin:14px auto 0;max-width:350px;font-size:17px;line-height:1.45;color:#82465e}
.progress{height:5px;background:#f0dce3;border-radius:9px;max-width:270px;margin:10px auto 0;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#e9a1b6,#c43d68);transition:width .5s}
.signature{font:italic 14px Georgia,serif;color:#b16d83;margin-top:12px}
.floating{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.floating span{position:absolute;bottom:-30px;color:#d67b99;animation:float 10s linear infinite;opacity:0}
.floating span:nth-child(1){left:9%;animation-delay:0s}.floating span:nth-child(2){left:83%;animation-delay:3s}
.floating span:nth-child(3){left:65%;animation-delay:6s}.floating span:nth-child(4){left:27%;animation-delay:4s}
@keyframes float{15%{opacity:.7}100%{transform:translateY(-110vh) rotate(35deg);opacity:0}}
@keyframes tilt{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes present{from{transform:translate(5px,15px) scale(.7)}to{transform:translate(0,0) scale(1)}}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
@media(max-width:390px){.stage{height:365px}.card{padding:24px 13px 20px}.story{font-size:16px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="floating" aria-hidden="true"><span>♡</span><span>✦</span><span>♥</span><span>✧</span></div>
<main class="card">
<header>
  <div class="kicker">Una historia hecha con cariño</div>
  <h1>Una rosa para ti 🌹</h1>
  <p class="subtitle">Mira lo que el osito preparó especialmente para ti</p>
</header>

<div class="stage">
<svg viewBox="0 0 420 420" role="img" aria-label="Un osito jardinero siembra una semilla, cuida una planta, hace crecer una rosa y se la ofrece a alguien especial">
<defs>
 <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9bd98"/><stop offset="1" stop-color="#b97953"/></linearGradient>
 <linearGradient id="petalGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff829b"/><stop offset="1" stop-color="#b90f42"/></linearGradient>
 <radialGradient id="sky"><stop stop-color="#fff8f2"/><stop offset="1" stop-color="#f9e5eb"/></radialGradient>
</defs>
<ellipse cx="210" cy="365" rx="175" ry="25" class="ground-shadow"/>
<path d="M30 356Q210 335 390 356L390 380Q210 402 30 380Z" class="ground"/>
<path d="M30 356Q210 335 390 356" fill="none" stroke="#6da86b" stroke-width="3"/>
<!-- pequeñas flores decorativas -->
<g fill="#fff1f4"><circle cx="54" cy="335" r="4"/><circle cx="64" cy="330" r="4"/><circle cx="59" cy="340" r="4"/><circle cx="360" cy="337" r="4"/><circle cx="370" cy="332" r="4"/><circle cx="365" cy="342" r="4"/></g>
<!-- semilla y tierra -->
<g id="seed" class="scene-part">
 <ellipse cx="285" cy="350" rx="33" ry="8" class="soil"/>
 <ellipse cx="285" cy="346" rx="25" ry="5" class="soil-light"/>
 <ellipse cx="285" cy="342" rx="5" ry="8" fill="#8a5738" transform="rotate(35 285 342)"/>
 <text x="285" y="315" text-anchor="middle" class="stage-label">Una semillita...</text>
</g>
<!-- planta que crece -->
<g id="rosePlant" class="scene-part">
 <path d="M285 350Q280 316 285 285Q290 256 283 229" class="plant-stem"/>
 <path d="M285 314Q251 286 240 305Q250 327 285 314Z" class="leaf"/>
 <path d="M286 294Q318 265 335 282Q329 307 286 294Z" class="leaf"/>
 <path d="M283 262Q258 240 248 255Q255 275 283 262Z" class="leaf"/>
 <g id="bud">
  <path d="M283 235Q265 221 274 204Q282 190 293 204Q307 217 291 236Z" fill="#df5474" stroke="#a91f48" stroke-width="2"/>
  <path d="M283 233Q278 215 289 205Q299 216 291 234Z" fill="#f47b91"/>
 </g>
 <g id="fullBloom" opacity="0">
  <path d="M285 224Q251 217 261 187Q275 171 288 190Q294 160 316 174Q332 195 306 214Q333 219 323 242Q300 252 285 224Q269 249 250 232Q247 211 285 224Z" class="petals"/>
  <path d="M286 215Q266 196 282 181Q300 177 302 195Q318 196 308 216Q299 230 286 215Z" class="petals-light"/>
  <path d="M286 211Q281 194 294 190Q307 198 298 213Q290 221 286 211Z" class="petals"/>
  <circle cx="293" cy="204" r="5" class="center"/>
 </g>
</g>
<!-- osito jardinero -->
<g id="bear">
 <!-- piernas -->
 <ellipse cx="135" cy="329" rx="38" ry="24" class="fur bear-outline"/>
 <ellipse cx="204" cy="329" rx="38" ry="24" class="fur bear-outline"/>
 <ellipse cx="135" cy="333" rx="18" ry="10" class="belly"/><ellipse cx="204" cy="333" rx="18" ry="10" class="belly"/>
 <!-- cuerpo -->
 <path d="M111 226Q119 196 170 196Q222 196 230 232L225 315Q170 341 111 315Z" class="fur bear-outline"/>
 <ellipse cx="171" cy="274" rx="40" ry="42" class="belly"/>
 <!-- overol -->
 <path d="M116 281Q170 295 225 281L222 316Q170 337 115 316Z" class="overall"/>
 <path d="M139 281L139 251Q170 241 201 251L201 281" fill="none" stroke="#557589" stroke-width="8"/>
 <circle cx="145" cy="283" r="4" fill="#f3d9b0"/><circle cx="195" cy="283" r="4" fill="#f3d9b0"/>
 <!-- cabeza -->
 <circle cx="123" cy="130" r="34" class="fur bear-outline"/><circle cx="216" cy="130" r="34" class="fur bear-outline"/>
 <circle cx="123" cy="130" r="18" class="inner-ear"/><circle cx="216" cy="130" r="18" class="inner-ear"/>
 <path d="M105 151Q105 75 170 75Q235 75 235 151Q235 216 170 220Q105 216 105 151Z" class="fur bear-outline"/>
 <ellipse cx="170" cy="171" rx="43" ry="31" class="muzzle"/>
 <ellipse cx="151" cy="145" rx="5" ry="7" class="eye"/><ellipse cx="189" cy="145" rx="5" ry="7" class="eye"/>
 <circle cx="152" cy="143" r="1.8" fill="white"/><circle cx="190" cy="143" r="1.8" fill="white"/>
 <ellipse cx="170" cy="165" rx="8" ry="6" class="nose"/>
 <path d="M170 171v8m0 0q-8 9-15 0m15 0q8 9 15 0" fill="none" stroke="#79503f" stroke-width="2.4" stroke-linecap="round"/>
 <ellipse cx="137" cy="177" rx="10" ry="6" class="cheek"/><ellipse cx="203" cy="177" rx="10" ry="6" class="cheek"/>
 <!-- gorrito jardinero -->
 <path d="M130 91Q135 54 171 53Q206 54 211 91Z" fill="#729b71" stroke="#4f7654" stroke-width="3"/>
 <path d="M119 91Q170 79 222 91Q222 103 170 103Q119 103 119 91Z" fill="#8db58a" stroke="#4f7654" stroke-width="3"/>
 <path d="M163 62q8-11 16 0q-8 8-16 0" fill="#f3d6a6"/>
 <!-- brazos dinámicos -->
 <path id="leftArm" d="M117 236Q82 251 96 284Q108 301 132 278" fill="none" stroke="#bd805a" stroke-width="23" stroke-linecap="round"/>
 <path id="rightArm" d="M222 235Q253 251 239 282Q231 294 214 278" fill="none" stroke="#bd805a" stroke-width="23" stroke-linecap="round"/>
</g>
<!-- regadera -->
<g id="watering-can" class="scene-part">
 <path d="M75 225Q69 210 84 204L123 204Q138 207 134 226L127 250Q121 259 88 253Z" fill="#8eafbb" stroke="#557b8c" stroke-width="3"/>
 <path d="M85 204Q89 178 111 181Q132 184 130 207" fill="none" stroke="#557b8c" stroke-width="5"/>
 <path d="M134 214L155 202L161 211L137 230Z" fill="#8eafbb" stroke="#557b8c" stroke-width="3"/>
 <path d="M160 201l10-5m-6 13l12-2m-17 8l10 4" stroke="#71a9cf" stroke-width="3" stroke-linecap="round"/>
</g>
<!-- gotitas -->
<g id="drops" class="scene-part" fill="#74bce0">
 <path d="M245 260q-9 13 0 17q9-4 0-17z"/><path d="M257 275q-8 12 0 15q8-3 0-15z"/>
 <path d="M238 285q-7 10 0 13q7-3 0-13z"/>
</g>
<!-- rosa arrancada que el osito entrega -->
<g id="pickedRose" class="scene-part">
 <path d="M280 245Q270 278 260 309" fill="none" stroke="#397e4c" stroke-width="5" stroke-linecap="round"/>
 <path d="M270 280q-23-20-34-3 15 18 34 3z" class="leaf"/>
 <path d="M274 266q21-20 32-5-11 18-32 5z" class="leaf"/>
 <path d="M280 250Q247 245 255 217Q267 199 282 218Q293 190 312 207Q325 226 300 241Q327 248 314 266Q291 274 280 250Q263 273 246 257Q245 239 280 250Z" fill="url(#petalGrad)" stroke="#a91f48" stroke-width="2"/>
 <path d="M280 244Q264 227 280 213Q297 211 299 229Q314 232 303 248Q292 260 280 244Z" class="petals-light"/>
 <path d="M281 240Q278 225 291 223Q302 231 292 244Q284 250 281 240Z" class="petals"/>
 <circle cx="290" cy="235" r="4" class="center"/>
</g>
<g id="glints" class="scene-part">
 <path d="M320 165q4 12 16 16-12 4-16 16-4-12-16-16 12-4 16-16z" class="sparkle"/>
 <path d="M245 180q3 9 12 12-9 3-12 12-3-9-12-12 9-3 12-12z" class="sparkle"/>
 <path d="M337 230q3 8 11 11-8 3-11 11-3-8-11-11 8-3 11-11z" class="sparkle"/>
</g>
<text id="captionSvg" x="210" y="405" text-anchor="middle" class="stage-label">Todo comienza con una semilla...</text>
</svg>
</div>

<div class="controls">
 <button id="play" type="button">▶ Ver cómo nace la rosa</button>
 <button id="reset" type="button">↺ Volver a empezar</button>
</div>
<div class="progress"><div id="bar"></div></div>
<p class="story" id="story" aria-live="polite">El osito encontró una semillita y decidió cultivar la rosa más bonita para alguien especial.</p>
<footer class="signature">Cultivada con paciencia, entregada con amor. 💗</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const parts=['seed','watering-can','drops','rosePlant','pickedRose','glints'];
let timers=[],running=false;
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function show(id,on=true){$(id).style.opacity=on?'1':'0'}
function say(text,caption,progress){
 $('story').textContent=text;$('captionSvg').textContent=caption;$('bar').style.width=progress+'%';
}
function reset(){
 clearTimers();running=false;
 parts.forEach(id=>show(id,false));
 $('bear').classList.remove('offer');
 $('rosePlant').classList.remove('hidden');
 $('pickedRose').classList.remove('show');
 $('fullBloom').style.opacity='0';$('bud').style.opacity='1';
 $('play').textContent='▶ Ver cómo nace la rosa';
 say('El osito encontró una semillita y decidió cultivar la rosa más bonita para alguien especial.','Todo comienza con una semilla...',0);
}
function at(ms,fn){timers.push(setTimeout(fn,ms))}
function play(){
 if(running)return;
 reset();running=true;$('play').textContent='La historia está floreciendo…';
 at(500,()=>{show('seed');say('Primero preparó la tierra y sembró con mucho cuidado una pequeña semilla.','Con cuidado la sembró...',12)});
 at(2600,()=>{show('watering-can');$('watering-can').classList.add('pour');show('drops');say('Cada día la regó, le dio luz y esperó con paciencia.','Un poquito de agua y mucho cariño...',28)});
 at(4800,()=>{show('rosePlant');show('watering-can',false);show('drops',false);say('La semillita despertó. Un tallito verde comenzó a crecer.','¡Mira cómo está creciendo!',45)});
 at(6900,()=>{ $('bud').style.opacity='1';say('El tallo se hizo fuerte y apareció un pequeño capullo.','Pronto será una hermosa rosa...',61)});
 at(8700,()=>{ $('bud').style.opacity='0';$('fullBloom').style.opacity='1';show('glints');say('Con sus cuidados, floreció una rosa roja, suave y hermosa.','¡Por fin floreció! 🌹',75)});
 at(10800,()=>{say('El osito se acercó, la tomó con delicadeza y la cortó para regalártela.','La eligió especialmente para ti...',88)});
 at(12400,()=>{show('pickedRose');$('pickedRose').classList.add('show');$('rosePlant').classList.add('hidden');$('bear').classList.add('offer');say('Y después de cultivarla con tanto cariño, vino a entregártela. Porque las cosas más bonitas se dan de corazón.','Esta rosa ahora es tuya ❤️',100);$('play').textContent='🌹 Ver la historia otra vez';running=false});
}
$('play').addEventListener('click',()=>{if(!running)play()});
$('reset').addEventListener('click',reset);
</script>
</body>
</html>
