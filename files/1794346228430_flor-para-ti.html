// Conversión HSV a RGB
function hsvToRgb(h, s, v) {
    let i = Math.floor(h * 6);
    let f = h * 6 - i;
    let p = v * (1 - s);
    let q = v * (1 - f * s);
    let t = v * (1 - (1 - f) * s);

    let r, g, b;

    switch (i % 6) {
        case 0: r=v; g=t; b=p; break;
        case 1: r=q; g=v; b=p; break;
        case 2: r=p; g=v; b=t; break;
        case 3: r=p; g=q; b=v; break;
        case 4: r=t; g=p; b=v; break;
        case 5: r=v; g=p; b=q; break;
    }

    return `rgb(${r*255},${g*255},${b*255})`;
}

// Variables de Turtle
let x, y, heading;

function resetTurtle() {
    x = 0;
    y = 0;
    heading = 0;
}

function right(degrees) {
    heading -= degrees * Math.PI / 180;
}

function left(degrees) {
    heading += degrees * Math.PI / 180;
}

function circle(radius, extent) {
    const cx = x - Math.sin(heading) * radius;
    const cy = y + Math.cos(heading) * radius;

    const start = Math.atan2(y - cy, x - cx);
    const end = start + extent * Math.PI / 180;

    ctx.beginPath();
    ctx.arc(cx, cy, Math.abs(radius), start, end);
    ctx.stroke();

    x = cx + radius * Math.cos(end);
    y = cy + radius * Math.sin(end);

    heading += extent * Math.PI / 180;
}

// Dibujar la flor
function drawFlower(time) {

    ctx.save();

    // Coordenadas centradas
    ctx.setTransform(
        DPR, 0, 0, -DPR,
        400 * DPR, 400 * DPR
    );

    // EFECTO DE GIRO
    const rotation = time * 0.00025;
    ctx.rotate(rotation);

    // EFECTO DE LATIDO
    const pulse = 1 + Math.sin(time * 0.0025) * 0.045;
    ctx.scale(pulse, pulse);

    resetTurtle();

    ctx.lineWidth = 2;
    ctx.lineCap = "round";

    for (let j = 0; j < 25; j++) {

        for (let i = 0; i < 15; i++) {

            ctx.strokeStyle = hsvToRgb(
                i / 15,
                j / 25,
                1
            );

            right(90);
            circle(200 - j * 4, 90);

            left(90);
            circle(200 - j * 4, 90);

            right(180);
            circle(50, 24);
        }
    }

    ctx.restore();
}

// Frase central
function drawPhrase(time) {

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    // Fondo central
    const gradient = ctx.createRadialGradient(
        400, 400, 10,
        400, 400, 140
    );

    gradient.addColorStop(0, "#241027");
    gradient.addColorStop(0.7, "#100912");
    gradient.addColorStop(1, "#000000");

    ctx.beginPath();
    ctx.arc(400, 400, 130, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();

    // Borde que también palpita
    const glow = 0.5 + Math.sin(time * 0.0025) * 0.5;

    ctx.beginPath();
    ctx.arc(400, 400, 128, 0, Math.PI * 2);

    ctx.strokeStyle = `rgba(255,150,220,${0.4 + glow * 0.6})`;
    ctx.lineWidth = 2;
    ctx.stroke();

    // Frase completa
    const lines = [
        "Quiero ser solo aquel",
        "que pueda besar tu piel",
        "recostarme entre tus piernas",
        "para ver el atardecer",
        "escapar y entender que",
        "el mundo es chico a mis pies",
        "ver tus ojos, ver al cielo",
        "tu sonrisa, el mal se fue"
    ];

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "bold 13px Georgia";

    // Centrado vertical y horizontal
    const lineHeight = 18;
    const startY = 400 - ((lines.length - 1) * lineHeight) / 2;

    lines.forEach((line, index) => {

        const yy = startY + index * lineHeight;

        ctx.shadowColor = "#ff71ce";
        ctx.shadowBlur = 12 + glow * 8;

        ctx.fillStyle = "#ffffff";
        ctx.fillText(line, 400, yy);
    });

    ctx.shadowBlur = 0;
}

// Animación principal
function animate(time) {

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    drawFlower(time);
    drawPhrase(time);

    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

// Controles de música
const backgroundMusic = document.getElementById("backgroundMusic");
const musicButton = document.getElementById("musicButton");
const musicStatus = document.getElementById("musicStatus");

musicButton.addEventListener("click", async () => {
    if (backgroundMusic.paused) {
        try {
            await backgroundMusic.play();
            musicButton.textContent = "⏸ Pausar";
            musicStatus.textContent = "Reproduciendo ♡";
        } catch (error) {
            musicStatus.textContent = "No se pudo iniciar el audio. Toca reproducir otra vez.";
        }
    } else {
        backgroundMusic.pause();
        musicButton.textContent = "▶ Reproducir";
        musicStatus.textContent = "En pausa";
    }
});

backgroundMusic.addEventListener("ended", () => {
    musicButton.textContent = "▶ Reproducir";
    musicStatus.textContent = "Nuestra canción ♡";
});

</script>
