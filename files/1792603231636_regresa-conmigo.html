    <section class="music-player" aria-label="Reproductor de música">
        <div class="music-player__disc" aria-hidden="true">♫</div>
        <div class="music-player__details">
            <span class="music-player__title">Regresa!!</span>
            <span class="music-player__status" id="musicStatus" aria-live="polite"></span>
        </div>
        <button class="music-player__toggle" id="musicToggle" type="button" aria-label="Reproducir música" aria-pressed="false">▶</button>
        <div class="music-player__timeline">
            <span id="musicCurrentTime">0:00</span>
            <input id="musicProgress" type="range" min="0" max="1000" value="0" aria-label="Progreso de la canción">
            <span id="musicDuration">0:00</span>
        </div>
    </section>
    <script>
    (() => {
    const backgroundMusic = document.getElementById('backgroundMusic');
    const musicToggle = document.getElementById('musicToggle');
    const musicStatus = document.getElementById('musicStatus');
    const musicProgress = document.getElementById('musicProgress');
    const musicCurrentTime = document.getElementById('musicCurrentTime');
    const musicDuration = document.getElementById('musicDuration');

    function formatMusicTime(seconds) {
        if (!Number.isFinite(seconds)) return '0:00';
        const minutes = Math.floor(seconds / 60);
        const remainingSeconds = Math.floor(seconds % 60).toString().padStart(2, '0');
        return `${minutes}:${remainingSeconds}`;
    }

    function updateMusicControls() {
        const isPlaying = !backgroundMusic.paused;
        musicToggle.textContent = isPlaying ? '❚❚' : '▶';
        musicToggle.setAttribute('aria-label', isPlaying ? 'Pausar música' : 'Reproducir música');
        musicToggle.setAttribute('aria-pressed', String(isPlaying));
        if (isPlaying) musicStatus.textContent = 'Reproduciendo';
        musicCurrentTime.textContent = formatMusicTime(backgroundMusic.currentTime);
        musicDuration.textContent = formatMusicTime(backgroundMusic.duration);
        musicProgress.value = Number.isFinite(backgroundMusic.duration) && backgroundMusic.duration > 0
            ? String(Math.round((backgroundMusic.currentTime / backgroundMusic.duration) * 1000))
            : '0';
    }

    function startMusic() {
        backgroundMusic.play().catch((error) => {
            musicStatus.textContent = 'No se pudo reproducir la canción';
            console.error('No se pudo reproducir la música:', error);
        });
    }

    document.addEventListener('click', (event) => {
        if (!(event.target instanceof Element) || event.target.closest('.music-player')) return;
        if (backgroundMusic.paused) startMusic();
    });

    musicToggle.addEventListener('click', () => {
        if (backgroundMusic.paused) {
            startMusic();
        } else {
            backgroundMusic.pause();
        }
    });

    musicProgress.addEventListener('input', () => {
        if (Number.isFinite(backgroundMusic.duration) && backgroundMusic.duration > 0) {
            backgroundMusic.currentTime = (Number(musicProgress.value) / 1000) * backgroundMusic.duration;
        }
    });

    backgroundMusic.addEventListener('play', updateMusicControls);
    backgroundMusic.addEventListener('pause', () => {
        updateMusicControls();
        musicStatus.textContent = 'En pausa';
    });
    backgroundMusic.addEventListener('timeupdate', updateMusicControls);
    backgroundMusic.addEventListener('loadedmetadata', updateMusicControls);
    backgroundMusic.addEventListener('error', () => {
        musicStatus.textContent = 'No se pudo cargar la canción';
    });
    })();
    </script>
