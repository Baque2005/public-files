<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flores Amarillas &ndash; Aisha</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%}

/* ── GLASS CARD ── */
.card-outer{
  position:fixed;top:0;left:0;right:0;bottom:38vh;
  display:flex;align-items:center;justify-content:center;
  z-index:10;padding:env(safe-area-inset-top,44px) 5vw 0;
  pointer-events:none
}
.card{
  pointer-events:all;
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,252,210,.20),rgba(255,235,59,.08));
  backdrop-filter:blur(22px) saturate(1.6);
  -webkit-backdrop-filter:blur(22px) saturate(1.6);
  border:1px solid rgba(255,255,255,.38);
  border-radius:clamp(16px,4vw,32px);
  padding:clamp(14px,3.5vw,30px) clamp(16px,4.5vw,40px);
  text-align:center;
  box-shadow:0 8px 40px rgba(0,0,0,.18),0 2px 0 rgba(255,255,255,.34) inset;
  max-width:min(86vw,420px);width:100%;
  animation:cardFloat 6s ease-in-out infinite
}
@keyframes cardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.eyebrow{font:normal clamp(8px,2.2vw,12px)/1 Georgia,serif;
  letter-spacing:.24em;text-transform:uppercase;
  color:rgba(255,255,255,.76);margin-bottom:8px}
.divider{width:46px;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(255,218,50,.6),transparent);
  margin:0 auto 10px}
.title{font:700 clamp(15px,4.5vw,27px)/1.28 Georgia,serif;
  color:#fff;margin-bottom:7px;
  text-shadow:0 2px 14px rgba(200,140,0,.55),0 1px 2px rgba(0,0,0,.42)}
.name{display:block;font:700 clamp(20px,6.5vw,40px)/1.2 Georgia,serif;
  margin-bottom:10px;
  background:linear-gradient(135deg,#fff9c4,#ffee58,#ffd740,#ffab00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  filter:drop-shadow(0 3px 10px rgba(255,160,0,.48));
  animation:nameGlow 4s ease-in-out infinite}
@keyframes nameGlow{
  0%,100%{filter:drop-shadow(0 3px 10px rgba(255,160,0,.48))}
  50%{filter:drop-shadow(0 4px 22px rgba(255,220,0,.82))}}
.message{font:italic clamp(10px,2.8vw,14px)/1.68 Georgia,serif;
  color:rgba(255,255,255,.90);margin-bottom:12px;
  text-shadow:0 1px 4px rgba(0,0,0,.28)}
.deco-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px}
.deco-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(255,218,50,.5),transparent)}
.deco-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,218,50,.62)}
.closing{font:normal clamp(9px,2.4vw,12px)/1 Georgia,serif;
  color:rgba(255,255,200,.76);letter-spacing:.12em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="card-outer">
  <div class="card">
    <div class="eyebrow">21 de Septiembre &nbsp;&middot;&nbsp; Primavera</div>
    <div class="divider"></div>
    <div class="title">Feliz D&iacute;a de las<br>Flores Amarillas</div>
    <span class="name">Aisha, mi amor</span>
    <p class="message">
      Como el sol que ilumina cada ma&ntilde;ana,<br>
      t&uacute; iluminas cada d&iacute;a de mi vida.<br>
      Estas flores son para ti,<br>
      que eres mi luz, mi alegr&iacute;a, mi primavera.
    </p>
    <div class="deco-row">
      <div class="deco-line"></div>
      <div class="deco-dot"></div>
      <div class="deco-dot" style="width:7px;height:7px;background:rgba(255,218,50,.82)"></div>
      <div class="deco-dot"></div>
      <div class="deco-line"></div>
    </div>
    <div class="closing">Con todo mi amor, siempre</div>
  </div>
</div>

<script>
/* =================================================================
   CANVAS SETUP
================================================================= */
const cv  = document.getElementById('c');
const ctx = cv.getContext('2d');
const PI2 = Math.PI * 2;
const GA  = 137.508 * (Math.PI / 180); // golden angle (Vogel)
let W, H, T = 0;

function resize() { W = cv.width = window.innerWidth; H = cv.height = window.innerHeight; }
resize();
window.addEventListener('resize', resize);

/* =================================================================
   STARS
================================================================= */
const STARS = Array.from({length:65}, () => ({
  x: Math.random(), y: Math.random() * .40,
  r: Math.random() * 1.8 + .4, ph: Math.random() * PI2
}));

/* =================================================================
   CLOUDS  –  clip-path silhouette approach for clean shapes
================================================================= */
const CLOUDS = [
  {cx:.18, cy:.09, w:.17, h:.10, spd:.000078, a:.92},
  {cx:.60, cy:.07, w:.20, h:.09, spd:.000050, a:.82},
  {cx:.82, cy:.14, w:.13, h:.07, spd:.000102, a:.70},
  {cx:.42, cy:.19, w:.10, h:.06, spd:.000066, a:.58},
];

// Normalized puff layout [dx/w, dy/h, r/h]
// Packed closer and larger radiuses to eliminate gaps
const PUFFS = [
  [0, 0, .65], [-.18, .08, .55], [.18, .07, .55], 
  [-.32, .18, .45], [.32, .18, .45], [-.10, -.18, .50], 
  [.10, -.15, .48], [-.42, .26, .35], [.42, .26, .35],
  [-.22, -.05, .45], [.22, -.04, .45]
];

function drawCloud(cx, cy, w, h, alpha) {
  /* soft drop-shadow */
  ctx.save();
  ctx.globalAlpha = alpha * .10;
  PUFFS.forEach(([dx,dy,fr]) => {
    ctx.beginPath();
    ctx.arc(cx+dx*w+4, cy+dy*h+9, fr*h*.88, 0, PI2);
    ctx.fillStyle = 'hsl(220,45%,62%)';
    ctx.fill();
  });
  ctx.restore();

  /* clip to union of circles → clean silhouette */
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  PUFFS.forEach(([dx,dy,fr]) => {
    const r = fr * h;
    ctx.moveTo(cx+dx*w+r, cy+dy*h);
    ctx.arc(cx+dx*w, cy+dy*h, r, 0, PI2);
  });
  ctx.clip();

  const top=cy-h*.92, bot=cy+h*.58, lft=cx-w*.74, rgt=cx+w*.74;
  const g = ctx.createLinearGradient(cx, top, cx, bot);
  g.addColorStop(0,   '#ffffff');
  g.addColorStop(.40, '#f7fbff');
  g.addColorStop(.80, '#e6f2ff');
  g.addColorStop(1,   '#d2e8ff');
  ctx.fillStyle = g;
  ctx.fillRect(lft, top, rgt-lft, bot-top);

  /* bottom ambient shade */
  const gs = ctx.createLinearGradient(cx, cy+h*.05, cx, bot);
  gs.addColorStop(0, 'rgba(148,188,228,0)');
  gs.addColorStop(1, 'rgba(128,175,220,.28)');
  ctx.fillStyle = gs;
  ctx.fillRect(lft, cy+h*.05, rgt-lft, bot-cy-h*.05);
  ctx.restore();
}

/* =================================================================
   SUN  –  volumetric rays + limb darkening + specular
================================================================= */
function drawSun(sx, sy, sr) {
  /* atmosphere glow */
  const atm = ctx.createRadialGradient(sx,sy,sr, sx,sy,sr*7);
  atm.addColorStop(0,  'rgba(255,240,100,.15)');
  atm.addColorStop(.5, 'rgba(255,210,50,.05)');
  atm.addColorStop(1,  'rgba(255,200,0,0)');
  ctx.beginPath(); ctx.arc(sx,sy,sr*7,0,PI2); ctx.fillStyle=atm; ctx.fill();

  /* volumetric ray fan */
  const N=24, RL=sr*10, RHW=(PI2/N)*.36;
  for (let i=0; i<N; i++) {
    const base = T*.14 + (i/N)*PI2;
    const flk  = .5+.5*Math.sin(T*1.25+i*.7+Math.cos(T*.42+i*1.15));
    const al   = .028+.028*flk;
    const len  = RL*(.72+.28*flk);
    const rg   = ctx.createLinearGradient(sx,sy, sx+Math.cos(base)*len, sy+Math.sin(base)*len);
    rg.addColorStop(0,   `rgba(255,238,80,${(al*2.5).toFixed(3)})`);
    rg.addColorStop(.25, `rgba(255,210,40,${al.toFixed(3)})`);
    rg.addColorStop(1,   'rgba(255,200,0,0)');
    ctx.beginPath();
    ctx.moveTo(sx,sy);
    ctx.lineTo(sx+Math.cos(base-RHW)*len, sy+Math.sin(base-RHW)*len);
    ctx.lineTo(sx+Math.cos(base+RHW)*len, sy+Math.sin(base+RHW)*len);
    ctx.closePath(); ctx.fillStyle=rg; ctx.fill();
  }

  /* corona halos */
  [2.8,1.8,1.3].forEach((m,i) => {
    const h2 = ctx.createRadialGradient(sx,sy,sr*m*.6, sx,sy,sr*m);
    h2.addColorStop(0, `rgba(255,230,80,${(.050/(i+1)).toFixed(3)})`);
    h2.addColorStop(1, 'rgba(255,200,0,0)');
    ctx.beginPath(); ctx.arc(sx,sy,sr*m,0,PI2); ctx.fillStyle=h2; ctx.fill();
  });

  /* disk body */
  const body = ctx.createRadialGradient(sx-sr*.28,sy-sr*.32,sr*.03, sx,sy,sr);
  body.addColorStop(0,  '#fffde7'); body.addColorStop(.2,'#fff9c4');
  body.addColorStop(.5, '#ffee58'); body.addColorStop(.8,'#fdd835');
  body.addColorStop(1,  '#f9a825');
  ctx.beginPath(); ctx.arc(sx,sy,sr,0,PI2); ctx.fillStyle=body; ctx.fill();

  /* limb darkening */
  const limb = ctx.createRadialGradient(sx,sy,sr*.65, sx,sy,sr);
  limb.addColorStop(0,'rgba(255,150,0,0)'); limb.addColorStop(1,'rgba(210,70,0,.16)');
  ctx.beginPath(); ctx.arc(sx,sy,sr,0,PI2); ctx.fillStyle=limb; ctx.fill();

  /* specular */
  const sp = ctx.createRadialGradient(sx-sr*.30,sy-sr*.34,0, sx-sr*.18,sy-sr*.18,sr*.60);
  sp.addColorStop(0,'rgba(255,255,255,.50)'); sp.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(sx,sy,sr,0,PI2); ctx.fillStyle=sp; ctx.fill();
}

/* =================================================================
   HILLS  –  three bezier layers
================================================================= */
function drawFarHill() {
  const g=ctx.createLinearGradient(0,H*.50,0,H);
  g.addColorStop(0,'#1a4a1e'); g.addColorStop(1,'#0c2810');
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,H*.62);
  ctx.bezierCurveTo(W*.14,H*.50, W*.34,H*.64, W*.50,H*.55);
  ctx.bezierCurveTo(W*.66,H*.46, W*.82,H*.59, W,H*.54);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
}
function drawMidHill() {
  const g=ctx.createLinearGradient(0,H*.46,0,H);
  g.addColorStop(0,'#2e7d32'); g.addColorStop(.5,'#256427'); g.addColorStop(1,'#1b5e20');
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,H*.70);
  ctx.bezierCurveTo(W*.12,H*.58, W*.28,H*.72, W*.46,H*.62);
  ctx.bezierCurveTo(W*.64,H*.52, W*.80,H*.65, W,H*.60);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
}
function drawFrontHill() {
  const g=ctx.createLinearGradient(0,H*.58,0,H);
  g.addColorStop(0,'#43a047'); g.addColorStop(.3,'#388e3c');
  g.addColorStop(.7,'#2e7d32'); g.addColorStop(1,'#1b5e20');
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,H*.80);
  ctx.bezierCurveTo(W*.10,H*.70, W*.26,H*.82, W*.44,H*.74);
  ctx.bezierCurveTo(W*.60,H*.66, W*.76,H*.78, W,H*.72);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  /* crest highlight */
  ctx.beginPath(); ctx.moveTo(0,H*.80);
  ctx.bezierCurveTo(W*.10,H*.70,W*.26,H*.82,W*.44,H*.74);
  ctx.bezierCurveTo(W*.60,H*.66,W*.76,H*.78,W,H*.72);
  ctx.strokeStyle='rgba(110,230,90,.20)'; ctx.lineWidth=3; ctx.stroke();
}

/* piecewise-linear approximations of the hill bezier crests */
function lookupY(xf, kp) {
  for (let i=0; i<kp.length-1; i++) {
    if (xf >= kp[i][0] && xf <= kp[i+1][0]) {
      const u=(xf-kp[i][0])/(kp[i+1][0]-kp[i][0]);
      return (kp[i][1]+u*(kp[i+1][1]-kp[i][1]))*H;
    }
  }
  return kp[kp.length-1][1]*H;
}
const MID_KP  = [[0,.700],[.12,.626],[.25,.698],[.36,.700],[.46,.620],[.55,.565],[.64,.520],[.72,.607],[.80,.660],[.90,.645],[1,.600]];
const FRNT_KP = [[0,.800],[.10,.745],[.20,.792],[.30,.800],[.44,.745],[.52,.706],[.60,.665],[.68,.708],[.76,.748],[.88,.755],[1,.722]];
const midY  = x => lookupY(x/W, MID_KP);
const frontY= x => lookupY(x/W, FRNT_KP);

/* =================================================================
   CUBIC BEZIER HELPER
================================================================= */
function cb(u, p0,p1,p2,p3) {
  const m=1-u;
  return m*m*m*p0 + 3*m*m*u*p1 + 3*m*u*u*p2 + u*u*u*p3;
}

/* =================================================================
   LEAF  (called with ctx already translated to attachment point)
================================================================= */
function leaf(side, headR) {
  const lw=headR*.60, lh=headR*.22, s=side;
  ctx.save(); ctx.rotate(s*.62);
  ctx.beginPath(); ctx.moveTo(0,0);
  ctx.bezierCurveTo(s*lw*.38,-lh,  s*lw,-lh*.30, s*lw*1.08,0);
  ctx.bezierCurveTo(s*lw*.90, lh*.22, s*lw*.38, lh*.44, 0,0);
  const lg=ctx.createLinearGradient(0,-lh, s*lw,lh);
  lg.addColorStop(0,'#66bb6a'); lg.addColorStop(1,'#2e7d32');
  ctx.fillStyle=lg; ctx.fill();
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(s*lw*.85,0);
  ctx.strokeStyle='rgba(30,90,30,.25)'; ctx.lineWidth=.7; ctx.stroke();
  ctx.restore();
}

/* =================================================================
   FLOWER  (all geometry in local coords, sway via rotate at base)
================================================================= */
function flower(xFrac, sizeFactor, petalCount, swayPhase, groundFn) {
  /* sizing */
  const bR   = Math.min(W*.10, H*.052);
  const headR = bR * sizeFactor;
  const diskR = headR * .36;
  const stemL = headR * 4.6;
  const pL    = headR * 1.10;   // petal length
  const pW    = headR * .31;    // petal max half-width
  const stW   = Math.max(2, headR*.088);

  const gx = xFrac * W;
  const gy = groundFn(gx) + headR*.30;  // slightly below hill crest

  /* stem bezier control points (local: origin = stem base) */
  const P1x= headR*.38, P1y=-stemL*.32;
  const P2x=-headR*.22, P2y=-stemL*.68;
  const P3x=0,          P3y=-stemL;

  const sway = Math.sin(T*.82 + swayPhase) * .030;

  ctx.save();
  ctx.translate(gx, gy);
  ctx.rotate(sway);

  /* ── STEM ── */
  const sg=ctx.createLinearGradient(-stW,0,stW,0);
  sg.addColorStop(0,'#2e7d32'); sg.addColorStop(.5,'#66bb6a'); sg.addColorStop(1,'#388e3c');
  ctx.beginPath(); ctx.moveTo(0,0);
  ctx.bezierCurveTo(P1x,P1y, P2x,P2y, P3x,P3y);
  ctx.strokeStyle=sg; ctx.lineWidth=stW; ctx.lineCap='round'; ctx.stroke();

  /* ── LEAVES ── */
  const lt1=.42, lt2=.65;
  ctx.save(); ctx.translate(cb(lt1,0,P1x,P2x,P3x), cb(lt1,0,P1y,P2y,P3y)); leaf(-1,headR); ctx.restore();
  ctx.save(); ctx.translate(cb(lt2,0,P1x,P2x,P3x), cb(lt2,0,P1y,P2y,P3y)); leaf( 1,headR); ctx.restore();

  /* ── FLOWER HEAD ── */
  ctx.save();
  ctx.translate(P3x, P3y);

  /* soft glow behind petals */
  const glw=ctx.createRadialGradient(0,0,diskR, 0,0,headR+pL*.75);
  glw.addColorStop(0,'rgba(255,235,60,.18)');
  glw.addColorStop(.5,'rgba(255,210,30,.07)');
  glw.addColorStop(1,'rgba(255,200,0,0)');
  ctx.beginPath(); ctx.arc(0,0,headR+pL*.75,0,PI2); ctx.fillStyle=glw; ctx.fill();

  /* ── PETALS
     Each petal: rotate to direction, translate outward to disk edge,
     draw teardrop bezier pointing in –Y (outward after rotation).
     Gradient created in petal's own local space → correct direction. ── */
  for (let i=0; i<petalCount; i++) {
    const angle = (PI2/petalCount)*i + Math.sin(i*2.1)*.025;
    ctx.save();
    ctx.rotate(angle);
    ctx.translate(0, -(diskR*.78));   // base at disk edge

    /* ── FAT ROUNDED PETAL SHAPE ──
       User wants them "gordas tipo circulares" (fat circular tip) */
    const bW = pW * .22;  // slightly wider base
    const tW = pW * .48;  // much wider tip for a circular/fat top

    ctx.beginPath();
    ctx.moveTo(-bW, 0);
    // LEFT side: pushes out wide and stays wide longer
    ctx.bezierCurveTo(-pW * 1.05, -pL * .15,  -pW * 1.15, -pL * .60,  -tW, -pL * .85);
    // ROUNDED FAT TIP: circular dome at the top
    ctx.quadraticCurveTo(0, -pL * 1.12,  tW, -pL * .85);
    // RIGHT side: mirror
    ctx.bezierCurveTo( pW * 1.15, -pL * .60,   pW * 1.05, -pL * .15,   bW, 0);
    // ROUNDED BASE
    ctx.quadraticCurveTo(0, pL * .05, -bW, 0);
    ctx.closePath();

    /* gradient from base (deep orange) to tip (pale cream) */
    const sh = .88 + .12*Math.sin(i*.85);
    const pg = ctx.createLinearGradient(0,0, 0,-pL);
    pg.addColorStop(0,    `rgba(${Math.round(218*sh)},${Math.round(85*sh)},0,1)`);
    pg.addColorStop(.15,  `rgba(${Math.round(252*sh)},${Math.round(206*sh)},25,1)`);
    pg.addColorStop(.55,  `rgba(255,${Math.round(235*sh)},52,1)`);
    pg.addColorStop(1,    `rgba(255,252,${Math.round(190*sh)},1)`);
    ctx.fillStyle=pg; ctx.fill();

    /* side edge highlight (gives 3-D curl feel) */
    ctx.beginPath();
    ctx.moveTo(-bW, 0);
    ctx.bezierCurveTo(-pW*.90,-pL*.08, -pW,-pL*.38, -tW,-pL*.86);
    ctx.strokeStyle=`rgba(255,245,100,${(.12*sh).toFixed(3)})`;
    ctx.lineWidth=Math.max(.6, headR*.016); ctx.stroke();

    /* central vein */
    ctx.beginPath(); ctx.moveTo(0,-pL*.06); ctx.lineTo(0,-pL*.84);
    ctx.strokeStyle='rgba(155,115,0,.16)';
    ctx.lineWidth=Math.max(.5,headR*.012); ctx.stroke();

    ctx.restore();
  }

  /* ── DISK ── */
  /* shadow */
  ctx.beginPath(); ctx.arc(diskR*.12,diskR*.14,diskR,0,PI2);
  ctx.fillStyle='rgba(0,0,0,.16)'; ctx.fill();

  /* body */
  const dg=ctx.createRadialGradient(-diskR*.28,-diskR*.30,0, 0,0,diskR);
  dg.addColorStop(0,'#7d5a48'); dg.addColorStop(.35,'#5d3e2e');
  dg.addColorStop(.75,'#4a2c1a'); dg.addColorStop(1,'#3e2012');
  ctx.beginPath(); ctx.arc(0,0,diskR,0,PI2); ctx.fillStyle=dg; ctx.fill();

  /* Vogel spiral seeds */
  const sN=Math.min(60, Math.max(18, Math.floor(diskR*diskR*.52)));
  for (let s=0; s<sN; s++) {
    const sr=diskR*.86*Math.sqrt(s/sN), sa=s*GA;
    ctx.beginPath();
    ctx.arc(sr*Math.cos(sa), sr*Math.sin(sa), Math.max(.8,diskR*.062), 0,PI2);
    ctx.fillStyle=`hsl(14,28%,${Math.round(17+(s%9)*2.2)}%)`; ctx.fill();
  }

  /* rim light */
  ctx.beginPath(); ctx.arc(0,0,diskR,0,PI2);
  ctx.strokeStyle='rgba(200,135,35,.28)'; ctx.lineWidth=diskR*.06; ctx.stroke();

  /* specular */
  const hl=ctx.createRadialGradient(-diskR*.28,-diskR*.30,0, 0,0,diskR);
  hl.addColorStop(0,'rgba(255,255,255,.20)');
  hl.addColorStop(.5,'rgba(255,255,255,.05)');
  hl.addColorStop(1,'rgba(255,255,255,0)');
  ctx.beginPath(); ctx.arc(0,0,diskR,0,PI2); ctx.fillStyle=hl; ctx.fill();

  ctx.restore(); // head
  ctx.restore(); // sway+base
}

/* =================================================================
   FLOWER DATA  [xFrac, sizeFactor, petalCount, swayPhase]
   Back row drawn before mid-hill → hill clips stem bases naturally.
   Front row drawn before front-hill → same effect.
================================================================= */
const BACK = [
  [.09,.50, 8,2.1],[.24,.64,10,1.7],[.45,.70,10, .8],
  [.58,.66,10,2.3],[.74,.58,10,1.4],[.90,.48, 8, .5],
];
const FRONT = [
  [.04,.48, 8, .3],[.14,.74,12,1.1],[.26,.90,13, .7],
  [.37,1.00,14,1.5],[.48,1.12,14, .4],[.60,1.06,14, .9],
  [.70,.94,12,1.8],[.80,.84,12, .2],[.89,.70,10,1.3],[.96,.48, 8,1.0],
];

/* =================================================================
   PARTICLES
================================================================= */
const PARTS = Array.from({length:30}, () => ({
  x:Math.random(), y:.25+Math.random()*.55,
  r:Math.random()*2+.8,
  spd:Math.random()*.000044+.000018,
  ph:Math.random()*PI2,
  hue:44+Math.random()*22
}));

/* =================================================================
   MAIN RENDER LOOP
================================================================= */
function render(ts) {
  T = ts * .001;

  /* sky */
  const sky=ctx.createLinearGradient(0,0,0,H*.78);
  sky.addColorStop(0,'#09286a'); sky.addColorStop(.10,'#0c3888');
  sky.addColorStop(.26,'#1462be'); sky.addColorStop(.45,'#1d88e5');
  sky.addColorStop(.62,'#40a4f5'); sky.addColorStop(.80,'#8ec9f9');
  sky.addColorStop(1,'#dff0fd');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  /* stars */
  STARS.forEach(s => {
    const a=.28+.62*Math.abs(Math.sin(T*1.1+s.ph));
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.r,0,PI2);
    ctx.fillStyle=`rgba(255,255,255,${a})`; ctx.fill();
  });

  /* horizon haze */
  const hz=ctx.createLinearGradient(0,H*.58,0,H*.80);
  hz.addColorStop(0,'rgba(255,250,200,0)'); hz.addColorStop(1,'rgba(255,240,150,.18)');
  ctx.fillStyle=hz; ctx.fillRect(0,H*.58,W,H*.22);

  /* sun */
  drawSun(W*.84, H*.11, Math.min(W,H)*.062);

  /* clouds */
  CLOUDS.forEach(cd => {
    cd.cx+=cd.spd; if(cd.cx>1.30) cd.cx=-.32;
    drawCloud(cd.cx*W, cd.cy*H, cd.w*W, cd.h*H, cd.a);
  });

  /* far hill */
  drawFarHill();

  /* BACK flowers (clipped by mid-hill drawn next) */
  BACK.forEach(([x,s,p,ph]) => flower(x,s,p,ph,midY));

  /* mid hill covers back flower bases */
  drawMidHill();

  /* FRONT flowers (clipped by front-hill drawn next) */
  FRONT.forEach(([x,s,p,ph]) => flower(x,s,p,ph,frontY));

  /* front hill + grass highlight covers front flower bases */
  drawFrontHill();

  /* floating motes */
  PARTS.forEach(p => {
    p.x+=p.spd; if(p.x>1.05) p.x=-.05;
    const px=p.x*W, py=p.y*H+Math.sin(T*.45+p.ph)*18;
    const a=.20+.50*Math.abs(Math.sin(T*.70+p.ph));
    ctx.beginPath(); ctx.arc(px,py,p.r,0,PI2);
    ctx.fillStyle=`hsla(${p.hue},100%,80%,${a})`; ctx.fill();
  });

  requestAnimationFrame(render);
}
requestAnimationFrame(render);

/* =================================================================
   TOUCH / CLICK BURST
================================================================= */
function burst(x, y) {
  const cols=['#ffee58','#ffd740','#ffca28','#ffe082','#fff176'];
  for (let i=0; i<10; i++) {
    const a=(PI2/10)*i, d=50+Math.random()*48;
    const el=document.createElement('div');
    el.style.cssText=`position:fixed;pointer-events:none;z-index:100;
      left:${x}px;top:${y}px;
      width:${8+Math.random()*7}px;height:${14+Math.random()*9}px;
      background:${cols[i%5]};border-radius:50% 50% 20% 20%;
      transform:translate(-50%,-50%) rotate(${(a*180/Math.PI).toFixed(1)}deg);
      box-shadow:0 0 5px rgba(255,220,0,.4);
      transition:transform .65s cubic-bezier(.25,.8,.25,1),opacity .65s ease-out;opacity:1`;
    document.body.appendChild(el);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.style.transform=`translate(calc(-50% + ${(Math.cos(a)*d).toFixed(1)}px),calc(-50% + ${(Math.sin(a)*d).toFixed(1)}px)) rotate(${((a*180/Math.PI)+200).toFixed(1)}deg) scale(.18)`;
      el.style.opacity='0';
    }));
    setTimeout(()=>el.remove(), 700);
  }
  const ring=document.createElement('div');
  ring.style.cssText=`position:fixed;pointer-events:none;z-index:99;
    left:${x}px;top:${y}px;width:0;height:0;border-radius:50%;
    border:2px solid rgba(255,235,58,.6);transform:translate(-50%,-50%);
    transition:width .6s ease-out,height .6s ease-out,opacity .6s ease-out;opacity:1`;
  document.body.appendChild(ring);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    ring.style.width='120px'; ring.style.height='120px'; ring.style.opacity='0';
  }));
  setTimeout(()=>ring.remove(), 650);
}

document.addEventListener('click', e=>burst(e.clientX,e.clientY));
document.addEventListener('touchstart', e=>{burst(e.touches[0].clientX,e.touches[0].clientY);},{passive:true});
document.addEventListener('touchmove', e=>e.preventDefault(),{passive:false});
</script>
