<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quieres ser?</title>
    <style>
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #ffffff;
    }

    .container {
        text-align: center;
    }

    #gifContainerImg {
        width: 60%;
        height: 60%;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        margin: 10px;
        cursor: pointer;
    }
    #siBtn {
        padding: 10px 20px; 
        font-size: 16px;
        margin: 10px;
        cursor: pointer;
        background-color: #009705; /* Verde */
        color: white;
        border: 2px solid #FFC0CB; /* Bordes rosa */
        border-radius: 10px; /* Esquinas redondeadas */
    }

    #noBtn {
        padding: 10px 20px;
        font-size: 16px;
        margin: 10px;
        cursor: pointer;
        background-color: #FF5733; /* Rojo */
        color: white;
        border: 2px solid #FFC0CB; /* Bordes rosa */
        border-radius: 10px; /* Esquinas redondeadas */
    }
    #noBtn span {
        font-size: 18px;
        color: #fcf4f4; /* Cambia el color del texto según tus preferencias */
        /* Otras propiedades de estilo aquí */
    }

    #siBtn:hover{
        background-color: #053a03; /* Cambia a otro color en hover, puedes ajustar el valor según tus preferencias */
    }
    #noBtn:hover {
        background-color: #641e0d; /* Cambia a otro color en hover, puedes ajustar el valor según tus preferencias */
    }
    .bg-green {
        background-color: #ffffff; /* Nuevo color de fondo verde */
    }

    #messageContainer {
        font-size: 30px;
        color: #FF0000; /* Color rojo */
        font-family: 'YourDesiredFont', sans-serif; /* Reemplaza 'YourDesiredFont' con la fuente que desees */
        text-shadow: 2px 2px 4px #000; /* Borde simulado */
        animation: pulse 0.5s infinite alternate; /* Animación de palpitación más rápida */
    }

    @keyframes pulse {
        from {
            transform: scale(1);
        }
        to {
            transform: scale(1.3); /* Zoom más grande */
        }
    }

    @keyframes sway {
        0%, 100% {
            transform: translateX(calc(-50% - 6px)) rotate(-2deg);
        }
        50% {
            transform: translateX(calc(-50% + 6px)) rotate(2deg);
        }
    }

    .successImage {
        position: absolute;
        top: 54%;
        left: 50%;
        z-index: 2;
        width: 28%;
        max-width: 140px;
        animation: sway 2.8s ease-in-out infinite;
    }

    #musicToggle {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 20;
        width: 48px;
        height: 48px;
        padding: 0;
        margin: 0;
        border: 2px solid #FFC0CB;
        border-radius: 50%;
        background-color: #009705;
        color: #ffffff;
        font-size: 20px;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
    }

    #musicToggle.is-paused {
        background-color: #FF5733;
    }

    #musicToggle:hover {
        filter: brightness(0.85);
    }
    </style>
</head>
<body>
    <audio id="musicaFondo" loop preload="auto">
        <source src="https://github.com/Cotipo12/video/raw/refs/heads/main/ssstik.io_1768968797360.mp3" type="audio/mpeg">
    </audio>
    <button id="musicToggle" class="is-paused" type="button" aria-label="Activar música" title="Activar o pausar música">▶</button>

    <div class="container">
        <div id="gifContainer">
            <img id="gifContainerImg" src="https://i.postimg.cc/1RVnLVT5/descarga-(1).png" alt="Imagen Inicial">
        </div>

    <h1 id="question">¿Aceptas mis hot wheels?</h1>
        <div id="messageContainer" style="display: none;"></div>

        <button id="siBtn">Sí</button>
        <button id="noBtn">No</button>
        
    </div>
    <script>
    const gifContainer = document.getElementById('gifContainer');
    const gifContainerImg = document.getElementById('gifContainerImg');
    const questionEl = document.getElementById('question');
    const messageContainer = document.getElementById('messageContainer');
    const siBtn = document.getElementById('siBtn');
    const noBtn = document.getElementById('noBtn');
    const container = document.querySelector('.container');
    const musicaFondo = document.getElementById('musicaFondo');
    const musicToggle = document.getElementById('musicToggle');

    let noButtonState = 0;
    let currentSadImg = null;
    let musicaActiva = false;

    function actualizarControlMusica() {
        musicToggle.textContent = musicaActiva ? '❚❚' : '▶';
        musicToggle.classList.toggle('is-paused', !musicaActiva);
        musicToggle.setAttribute('aria-label', musicaActiva ? 'Pausar música' : 'Activar música');
    }

    async function reproducirMusica() {
        if (musicaActiva) return;

        try {
            await musicaFondo.play();
            musicaActiva = true;
            actualizarControlMusica();
        } catch (error) {
            console.log('La música requiere interacción del usuario:', error);
        }
    }

    document.addEventListener('pointerdown', function(event) {
        if (!musicToggle.contains(event.target)) reproducirMusica();
    });

    musicToggle.addEventListener('click', async function() {
        if (musicaActiva) {
            musicaFondo.pause();
            musicaActiva = false;
            actualizarControlMusica();
        } else {
            await reproducirMusica();
        }
    });

    const noMessages = [
        '¡Mira qué geniales, Hacen run run!',
        'Aceptalos pues! toma!!',
        'Me costaron mucho, aceptalos!!',
        'Y ahora que hare con todo esto?',
        'Se los doy a otra persona!',
        'Es mentira, son solo para ti',
        'Los aceptaras si o si!',
        'Un Hot Wheels por cada sonrisa tuya',
        'Los voy a esconder!!',
        'Los Hot Wheels dicen que tienes excelente gusto',
        '¿Ni siquiera uno? Vienen con cariño incluido',
        'Última oportunidad',
        'Acepta los Hot Wheels y todos salimos felices',
        'No puedes decirle que no a unos carritos tan geniales',
        'Creo que los Hot Wheels ya te eligieron a ti',
        'Di que sí y ya!!',
        'Te los dejaré mientras duermes!'
    ];

    const sadImages = [
        'https://i.postimg.cc/1RVnLVT5/descarga-(1).png',
        'https://i.pinimg.com/736x/6e/3b/54/6e3b54ed20362e24aed420acfbf9398f.jpg',
        'https://i.pinimg.com/1200x/9b/79/97/9b7997851e5fb507ab23b076f6c147bd.jpg',
        'https://i.pinimg.com/736x/da/9e/93/da9e93e04a0bc3e033c1a8da5c4c6cb2.jpg',
        'https://i.pinimg.com/736x/b9/26/80/b92680bd8e8971b42bc741b810370913.jpg',
        'https://i.pinimg.com/736x/22/f6/ba/22f6ba32982b2e99e677cb3448130062.jpg',
        'https://i.pinimg.com/236x/b7/29/79/b72979901a78387fa637d2e914e97272.jpg'
    ];

    function removeCurrentSadImage() {
        if (currentSadImg) {
            currentSadImg.remove();
            currentSadImg = null;
        }
    }

    function showSadImage(index) {
        removeCurrentSadImage();
        const src = sadImages[index];
        if (!src) return;
        currentSadImg = document.createElement('img');
        currentSadImg.src = src;
        currentSadImg.alt = 'Imagen triste';
        currentSadImg.style.width = '80%';
        currentSadImg.style.height = '80%';
        currentSadImg.style.display = 'block';
        currentSadImg.style.margin = '0 auto 20px';
        container.insertBefore(currentSadImg, questionEl);
    }

    function showSuccessMessage() {
        gifContainer.style.display = 'none';
        removeCurrentSadImage();
        questionEl.style.display = 'none';
        siBtn.style.display = 'none';
        noBtn.style.display = 'none';
        document.body.classList.add('bg-green');
        messageContainer.style.display = 'block';
        messageContainer.innerHTML = 'Ten tus hot wheels es lo que te mereces precioso!';

        let gifContainerFinal = document.getElementById('gifContainerFinal');
        if (!gifContainerFinal) {
            gifContainerFinal = document.createElement('div');
            gifContainerFinal.id = 'gifContainerFinal';
            gifContainerFinal.style.marginTop = '20px';
            gifContainerFinal.style.display = 'flex';
            gifContainerFinal.style.justifyContent = 'center';
            gifContainerFinal.style.alignItems = 'center';
            gifContainerFinal.style.position = 'relative';
            gifContainerFinal.style.width = '100%';
            const successImage = document.createElement('img');
            successImage.src = 'https://i.pinimg.com/originals/53/d0/5a/53d05a9e4055d477bf8effa28e28bad5.png';
            successImage.alt = 'Hot Wheels ramo';
            successImage.className = 'successImage';
            gifContainerFinal.appendChild(successImage);
            const gif = document.createElement('img');
            gif.src = 'https://i.pinimg.com/originals/88/14/9b/88149b0400750578f4d07d9bc3fb0fee.gif';
            gif.alt = 'Celebración';
            gif.style.maxWidth = '80%';
            gif.style.maxHeight = '400px';
            gifContainerFinal.appendChild(gif);
            container.appendChild(gifContainerFinal);
        } else {
            gifContainerFinal.style.display = 'flex';
        }
    }

    siBtn.addEventListener('click', showSuccessMessage);

    noBtn.addEventListener('click', function() {
        if (noButtonState >= noMessages.length) {
            noButtonState = 0;
            noBtn.textContent = noMessages[0];
            removeCurrentSadImage();
            gifContainer.style.display = 'block';
            return;
        }

        if (noButtonState === 0) {
            gifContainer.style.display = 'none';
        }

        noBtn.textContent = noMessages[noButtonState];
        noBtn.style.backgroundColor = '#F1330A';
        const fontSize = 40 + Math.min(noButtonState, 6) * 10;
        const padding = 20 + Math.min(noButtonState, 6) * 10;
        siBtn.style.fontSize = fontSize + 'px';
        siBtn.style.padding = padding + 'px ' + (padding + 20) + 'px';

        showSadImage(Math.min(noButtonState + 1, sadImages.length - 1));

        noButtonState++;
    });
    </script>
</body>
</html>
