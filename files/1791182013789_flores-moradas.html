<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nicol — Un detalle para comenzar a conocernos</title>
    <style>
        *,
        *::after,
        *::before {
          padding: 0;
          margin: 0;
          box-sizing: border-box;
        }

        :root {
          --dark-color: #000;
          --fl-speed: 0.8s;
          --speed-leaf: 2s;
        }

        body {
          display: flex;
          align-items: flex-end;
          justify-content: center;
          min-height: 100vh;
          background-color: var(--dark-color);
          overflow: hidden;
          perspective: 1000px;
        }

        .night {
          position: fixed;
          left: 50%;
          top: 0;
          transform: translateX(-50%);
          width: 100%;
          height: 100%;
          filter: blur(0.1vmin);
          background-image: radial-gradient(
              ellipse at top,
              transparent 0%,
              var(--dark-color)
            ),
            radial-gradient(
              ellipse at bottom,
              var(--dark-color),
              rgba(145, 233, 255, 0.2)
            ),
            repeating-linear-gradient(
              220deg,
              rgb(0, 0, 0) 0px,
              rgb(0, 0, 0) 19px,
              transparent 19px,
              transparent 22px
            ),
            repeating-linear-gradient(
              189deg,
              rgb(0, 0, 0) 0px,
              rgb(0, 0, 0) 19px,
              transparent 19px,
              transparent 22px
            ),
            repeating-linear-gradient(
              148deg,
              rgb(0, 0, 0) 0px,
              rgb(0, 0, 0) 19px,
              transparent 19px,
              transparent 22px
            ),
            linear-gradient(90deg, rgb(0, 255, 250), rgb(240, 240, 240));
        }

        .shooting-stars {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
          z-index: 1;
        }

        .shooting-star {
          position: absolute;
          width: 4px;
          height: 4px;
          background: #fff;
          border-radius: 50%;
          box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.8);
          opacity: 0;
          animation: shootingStar 3s linear infinite;
        }

        .shooting-star::before {
          content: '';
          position: absolute;
          top: 50%;
          right: 0;
          transform: translateY(-50%);
          width: 0;
          height: 2px;
          background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 1) 100%);
          animation: shootingStarTail 3s linear infinite;
        }

        .shooting-star:nth-child(1) {
          top: 5%;
          left: -10%;
          animation-delay: 0s;
          animation-duration: 2.5s;
        }

        .shooting-star:nth-child(2) {
          top: 15%;
          left: -10%;
          animation-delay: 2s;
          animation-duration: 3s;
        }

        .shooting-star:nth-child(3) {
          top: 25%;
          left: -10%;
          animation-delay: 4s;
          animation-duration: 2.8s;
        }

        .shooting-star:nth-child(4) {
          top: 0%;
          left: -10%;
          animation-delay: 6s;
          animation-duration: 3.2s;
        }

        .shooting-star:nth-child(5) {
          top: 35%;
          left: -10%;
          animation-delay: 8s;
          animation-duration: 2.7s;
        }

        .shooting-star:nth-child(6) {
          top: 8%;
          left: -10%;
          animation-delay: 10s;
          animation-duration: 3.1s;
        }

        .shooting-star:nth-child(7) {
          top: 45%;
          left: -10%;
          animation-delay: 12s;
          animation-duration: 2.9s;
        }

        .shooting-star:nth-child(8) {
          top: 3%;
          left: -10%;
          animation-delay: 14s;
          animation-duration: 3.3s;
        }

        @keyframes shootingStar {
          0% {
            opacity: 0;
            transform: translateX(0) translateY(0) rotate(45deg);
          }
          10% {
            opacity: 1;
          }
          90% {
            opacity: 1;
          }
          100% {
            opacity: 0;
            transform: translateX(120vw) translateY(50vh) rotate(10deg);
          }
        }

        @keyframes shootingStarTail {
          0% {
            width: 0;
          }
          30% {
            width: 100px;
          }
          100% {
            width: 0;
          }
        }

        .flowers {
          position: relative;
          transform: scale(1);
          z-index: 2;
        }

        .flower {
          position: absolute;
          bottom: 15vmin;
          transform-origin: bottom center;
          z-index: 50;
        }

        .flower--1 {
          animation: moving-flower-1 4s linear infinite;
        }

        .flower--1 .flower__line {
          height: 70vmin;
          animation-delay: 0.3s;
        }

        .flower--1 .flower__line__leaf--1 {
          animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
        }

        .flower--1 .flower__line__leaf--2 {
          animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
        }

        .flower--1 .flower__line__leaf--3 {
          animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
        }

        .flower--1 .flower__line__leaf--4 {
          animation: blooming-leaf-left var(--fl-speed) 1s backwards;
        }

        .flower--2 {
          left: 50%;
          transform: rotate(20deg);
          animation: moving-flower-2 4s linear infinite;
        }

        .flower--2 .flower__line {
          height: 60vmin;
          animation-delay: 0.6s;
        }

        .flower--2 .flower__line__leaf--1 {
          animation: blooming-leaf-right var(--fl-speed) 1.9s backwards;
        }

        .flower--2 .flower__line__leaf--2 {
          animation: blooming-leaf-right var(--fl-speed) 1.7s backwards;
        }

        .flower--2 .flower__line__leaf--3 {
          animation: blooming-leaf-left var(--fl-speed) 1.5s backwards;
        }

        .flower--2 .flower__line__leaf--4 {
          animation: blooming-leaf-left var(--fl-speed) 1.3s backwards;
        }

        .flower--3 {
          left: 50%;
          transform: rotate(-15deg);
          animation: moving-flower-3 4s linear infinite;
        }

        .flower--3 .flower__line {
          animation-delay: 0.9s;
        }

        .flower--3 .flower__line__leaf--1 {
          animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
        }

        .flower--3 .flower__line__leaf--2 {
          animation: blooming-leaf-right var(--fl-speed) 2.3s backwards;
        }

        .flower--3 .flower__line__leaf--3 {
          animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
        }

        .flower--3 .flower__line__leaf--4 {
          animation: blooming-leaf-left var(--fl-speed) 1.9s backwards;
        }

        .flower--4 {
          left: -25%;
          z-index: -6;
          transform: rotate(10deg);
          animation: moving-flower-4 3.5s linear infinite;
        }

        .flower--4 .flower__line {
          height: 90vmin;
          animation-delay: 1.2s;
        }

        .flower--4 .flower__line__leaf--1 {
          animation: blooming-leaf-right var(--fl-speed) 2.8s backwards;
        }

        .flower--4 .flower__line__leaf--2 {
          animation: blooming-leaf-right var(--fl-speed) 2.6s backwards;
        }

        .flower--4 .flower__line__leaf--3 {
          animation: blooming-leaf-left var(--fl-speed) 2.4s backwards;
        }

        .flower--4 .flower__line__leaf--4 {
          animation: blooming-leaf-left var(--fl-speed) 2.2s backwards;
        }

        .flower--5 {
          left: 75%;
          z-index: -7;
          transform: rotate(-25deg);
          animation: moving-flower-5 4.5s linear infinite;
        }

        .flower--5 .flower__line {
          height: 85vmin;
          animation-delay: 1.9s;
        }

        .flower--5 .flower__line__leaf--1 {
          animation: blooming-leaf-right var(--fl-speed) 2.7s backwards;
        }

        .flower--5 .flower__line__leaf--2 {
          animation: blooming-leaf-right var(--fl-speed) 2.5s backwards;
        }

        .flower--5 .flower__line__leaf--3 {
          animation: blooming-leaf-left var(--fl-speed) 2.3s backwards;
        }

        .flower--5 .flower__line__leaf--4 {
          animation: blooming-leaf-left var(--fl-speed) 2.1s backwards;
        }

        .flower__leafs {
          position: relative;
          animation: blooming-flower 2s backwards;
        }

        .flower__leafs[role="button"] {
          cursor: pointer;
          touch-action: manipulation;
        }
        .flower__leafs[role="button"]:focus-visible {
          outline: 2px solid #f0d9ff;
          outline-offset: 5px;
          border-radius: 50%;
        }

        .flower__leafs--1 {
          animation-delay: 1.1s;
        }

        .flower__leafs--2 {
          animation-delay: 1.4s;
        }

        .flower__leafs--3 {
          animation-delay: 1.7s;
        }

        .flower__leafs--4 {
          animation-delay: 2.0s;
        }

        .flower__leafs--5 {
          animation-delay: 2.0s;
        }

        .flower__leafs::after {
          content: "";
          position: absolute;
          left: 0;
          top: 0;
          transform: translate(-50%, -100%);
          width: 8vmin;
          height: 8vmin;
          background-color: #ffdd00;
          filter: blur(10vmin);
        }

        /* --- PÉTALOS DE TULIPÁN (MEJORADOS) --- */
        .flower__leaf {
          position: absolute;
          bottom: 0;
          left: 50%;
          width: 13vmin;
          height: 22vmin;
          background: radial-gradient(circle at 50% 20%, #e0b3ff 0%, #a259e6 30%, #6c0a4e 60%, #4b0066 80%, #1a0033 100%);
          border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
          transform-origin: bottom center;
          opacity: 0.97;
          z-index: 2;
          border: 2px solid #003366;
          box-shadow:
            0 0 1.5vmin #5fa8e6,
            0 0 0.7vmin #b3e0ff,
            inset 0 0 2vmin #001133;
        }

        /* Pétalos externos */
        .flower__leaf--1 { transform: translate(-50%, -5%) rotate(-22deg); z-index: 1; }
        .flower__leaf--2 { transform: translate(-50%, -5%) rotate(22deg);  z-index: 1; }
        .flower__leaf--3 { transform: translate(-50%, -10%) rotate(0deg);  z-index: 2; }

        /* Pétalos internos (más pequeños, para dar volumen) */
        .flower__leaf--4,
        .flower__leaf--5,
        .flower__leaf--6 {
          width: 10vmin;
          height: 18vmin;
          background: radial-gradient(circle at 50% 20%, #f4e0ff 0%, #e0b3ff 30%, #a259e6 55%, #6c0a4e 80%, #1a0033 100%);
          opacity: 0.96;
          border: 1.5px solid #001133;
          border-radius: 50% 50% 45% 45% / 65% 65% 35% 35%;
          box-shadow:
            0 0 1.2vmin #b3e0ff,
            inset 0 0 1.5vmin #5fa8e6;
          z-index: 3;
        }

        .flower__leaf--4 { transform: translate(-50%, -8%) rotate(-10deg); }
        .flower__leaf--5 { transform: translate(-50%, -8%) rotate(10deg); }
        .flower__leaf--6 { transform: translate(-50%, -12%) rotate(0deg); }

        /* Centro del tulipán */
        .flower__center {
          position: absolute;
          left: -3vmin;
          top: -3vmin;
          width: 6vmin;
          height: 6vmin;
          border-radius: 50%;
          background:
            radial-gradient(circle at 30% 30%, #e0b3ff 0%, #a259e6 80%, #4b0066 100%);
          border: 2.5px solid #a259e6;
          box-shadow:
            0 0 1.5vmin #e0b3ff,
            0 0 1vmin #a259e6,
            inset 0 0 1.5vmin #4b0066;
        }

        .flower__line {
          height: 80vmin;
          width: 3vmin;
          background-image: linear-gradient(
              to left,
              rgb(0, 0, 0, 0.3),
              transparent,
              rgba(255, 255, 255, 0.2)
            ),
            linear-gradient(to top, transparent 10%, #2d5016, #4a7c23, #6b8e23);
          box-shadow: inset 0 0 2.5px rgba(0, 0, 0, 0.7);
          animation: grow-flower-tree 4s backwards;
        }

        .flower__line__leaf {
          --w: 8vmin;
          --h: calc(var(--w) + 3vmin);
          position: absolute;
          top: 20%;
          left: 90%;
          width: var(--w);
          height: var(--h);
          border-top-right-radius: var(--h);
          border-bottom-left-radius: var(--h);
          background-image: linear-gradient(
            to top,
            rgba(45, 80, 22, 0.6),
            #4a7c23,
            #6b8e23
          );
          box-shadow: inset 0 0 1vmin rgba(0, 0, 0, 0.3);
        }

        .flower__line__leaf--1 {
          transform: rotate(70deg) rotateY(30deg);
        }

        .flower__line__leaf--2 {
          top: 45%;
          transform: rotate(70deg) rotateY(30deg);
        }

        .flower__line__leaf--3,
        .flower__line__leaf--4{
          border-top-right-radius: 0;
          border-bottom-left-radius: 0;
          border-top-left-radius: var(--h);
          border-bottom-right-radius: var(--h);
          left: -460%;
          top: 12%;
          transform: rotate(-70deg) rotateY(30deg);
        }

        .flower__line__leaf--4 {
          top: 40%;
        }

        .flower__light {
          position: absolute;
          bottom: 0vmin;
          width: 0.8vmin;
          height: 0.8vmin;
          background-color: #fff;
          border-radius: 50%;
          filter: blur(0.1vmin);
          animation: tulip-light 6s linear infinite backwards;
          box-shadow: 0 0 1vmin rgba(255,255,255,0.8);
        }

        .flower__light:nth-child(odd) {
          background-color: #fff;
        }

        .flower__light--1 { left: -2vmin; animation-delay: 1s; }
        .flower__light--2 { left: 3vmin; animation-delay: 0.5s; }
        .flower__light--3 { left: -6vmin; animation-delay: 0.3s; }
        .flower__light--4 { left: 6vmin; animation-delay: 0.9s; }
        .flower__light--5 { left: -1vmin; animation-delay: 1.5s; }
        .flower__light--6 { left: -4vmin; animation-delay: 3s; }
        .flower__light--7 { left: 3vmin; animation-delay: 2s; }
        .flower__light--8 { left: -6vmin; animation-delay: 3.5s; }

        .flower__grass {
          --c: #4a7c23;
          --line-w: 2vmin;
          position: absolute;
          bottom: 12vmin;
          left: -7vmin;
          display: flex;
          flex-direction: column;
          align-items: flex-end;
          z-index: 20;
          transform-origin: bottom center;
          transform: rotate(-48deg) rotateY(40deg);
        }

        .flower__grass--1 {
          animation: moving-grass 2s linear infinite;
        }

        .flower__grass--2 {
          left: 2vmin;
          bottom: 10vmin;
          transform: scale(0.5) rotate(75deg) rotateX(10deg) rotateY(-200deg);
          opacity: 0.8;
          z-index: 0;
          animation: moving-grass--2 1.5s linear infinite;
        }

        .flower__grass--3 {
          left: -25vmin;
          bottom: 8vmin;
          transform: scale(0.7) rotate(-30deg) rotateY(45deg);
          opacity: 0.9;
          z-index: 15;
          animation: moving-grass--3 2.2s linear infinite;
        }

        .flower__grass--4 {
          left: -35vmin;
          bottom: 15vmin;
          transform: scale(0.4) rotate(60deg) rotateX(15deg) rotateY(-180deg);
          opacity: 0.7;
          z-index: 5;
          animation: moving-grass--4 1.8s linear infinite;
        }

        .flower__grass--5 {
          left: -18vmin;
          bottom: 6vmin;
          transform: scale(0.6) rotate(-60deg) rotateY(60deg);
          opacity: 0.85;
          z-index: 12;
          animation: moving-grass--5 2.5s linear infinite;
        }

        .flower__grass--6 {
          left: 25vmin;
          bottom: 9vmin;
          transform: scale(0.65) rotate(35deg) rotateY(-45deg);
          opacity: 0.9;
          z-index: 15;
          animation: moving-grass--6 2.3s linear infinite;
        }

        .flower__grass--7 {
          left: 35vmin;
          bottom: 14vmin;
          transform: scale(0.45) rotate(-70deg) rotateX(20deg) rotateY(170deg);
          opacity: 0.75;
          z-index: 8;
          animation: moving-grass--7 1.9s linear infinite;
        }

        .flower__grass--8 {
          left: 18vmin;
          bottom: 5vmin;
          transform: scale(0.55) rotate(50deg) rotateY(-70deg);
          opacity: 0.8;
          z-index: 10;
          animation: moving-grass--8 2.1s linear infinite;
        }

        .flower__grass--9 {
          left: -45vmin;
          bottom: 20vmin;
          transform: scale(0.3) rotate(20deg) rotateY(90deg);
          opacity: 0.6;
          z-index: 2;
          animation: moving-grass--9 1.6s linear infinite;
        }

        .flower__grass--10 {
          left: 42vmin;
          bottom: 18vmin;
          transform: scale(0.35) rotate(-45deg) rotateY(-120deg);
          opacity: 0.65;
          z-index: 3;
          animation: moving-grass--10 2.0s linear infinite;
        }

        .flower__grass--top {
          width: 7vmin;
          height: 10vmin;
          border-top-right-radius: 100%;
          border-right: var(--line-w) solid var(--c);
          transform-origin: bottom center;
          transform: rotate(-2deg);
        }

        .flower__grass--bottom {
          margin-top: -2px;
          width: var(--line-w);
          height: 25vmin;
          background-image: linear-gradient(to top, transparent, var(--c));
        }

        .flower__grass__leaf {
          --size: 10vmin;
          position: absolute;
          width: calc(var(--size) * 2.1);
          height: var(--size);
          border-top-left-radius: var(--size);
          border-top-right-radius: var(--size);
          background-image: linear-gradient(
            to top,
            transparent,
            transparent 30%,
            var(--c)
          );
          z-index: 100;
        }

        .flower__grass__leaf--1 {
          top: -6%;
          left: 30%;
          --size: 6vmin;
          transform: rotate(-20deg);
          animation: growing-grass-ans--1 var(--speed-leaf) 2.6s backwards;
        }

        .flower__grass__leaf--2 {
          top: -5%;
          left: -110%;
          --size: 6vmin;
          transform: rotate(10deg);
          animation: growing-grass-ans--2 var(--speed-leaf) 2.4s linear backwards;
        }

        .flower__grass__leaf--3 {
          top: 5%;
          left: 60%;
          --size: 8vmin;
          transform: rotate(-18deg) rotateX(-20deg);
          animation: growing-grass-ans--3 var(--speed-leaf) 2.2s linear backwards;
        }

        .flower__grass__leaf--4 {
          top: 6%;
          left: -135%;
          --size: 8vmin;
          transform: rotate(2deg);
          animation: growing-grass-ans--4 var(--speed-leaf) 2s linear backwards;
        }

        .flower__grass__leaf--5 {
          top: 20%;
          left: 60%;
          --size: 10vmin;
          transform: rotate(-24deg) rotateX(-20deg);
          animation: growing-grass-ans--5 var(--speed-leaf) 1.8s linear backwards;
        }

        .flower__grass__leaf--6 {
          top: 22%;
          left: -180%;
          --size: 10vmin;
          transform: rotate(10deg);
          animation: growing-grass-ans--6 var(--speed-leaf) 1.6s linear backwards;
        }

        .flower__grass__leaf--7 {
          top: 39%;
          left: 70%;
          --size: 10vmin;
          transform: rotate(-10deg);
          animation: growing-grass-ans--7 var(--speed-leaf) 1.4s linear backwards;
        }

        .flower__grass__leaf--8 {
          top: 40%;
          left: -215%;
          --size: 11vmin;
          transform: rotate(10deg);
          animation: growing-grass-ans--8 var(--speed-leaf) 1.2s linear backwards;
        }

        .flower__grass__overlay {
          position: absolute;
          top: -10%;
          right: 0%;
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.6);
          filter: blur(1.5vmin);
          z-index: 100;
        }

    .special-text {
      position: fixed;
      top: 5%;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: "Segoe Script", "Brush Script MT", cursive;
      font-size: 6.5vmin;
      text-shadow:
        0 0 8px #fff,
        0 0 16px #fff,
        0 0 32px #00eaff,
        0 0 48px #00eaff;
      z-index: 10;
      opacity: 0;
      animation: fadeIn 3s 1s forwards, glowText 2s 4s infinite alternate;
      text-align: center;
    }

    .music-bar {
      position: fixed;
      left: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(520px, calc(100% - 24px));
      padding: 12px 16px;
      border: 1px solid rgba(224, 179, 255, 0.7);
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(42, 16, 62, 0.96), rgba(14, 10, 32, 0.94));
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55), 0 0 24px rgba(162, 89, 230, 0.5), inset 0 1px rgba(255, 255, 255, 0.12);
      color: #fff;
      font: 14px/1.3 Arial, sans-serif;
      z-index: 500;
      backdrop-filter: blur(10px);
    }
    .music-bar__header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .music-bar__disc {
      display: grid;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      background: radial-gradient(circle, #f0d9ff 0 10%, #a259e6 12% 28%, #321046 31% 100%);
      box-shadow: 0 0 14px rgba(224, 179, 255, 0.45);
      color: #fff;
      font-size: 17px;
    }
    .music-bar__title {
      display: block;
      color: #f0d9ff;
      font-weight: 600;
      font-family: "Segoe Script", "Brush Script MT", cursive;
      text-shadow: 0 0 10px rgba(224, 179, 255, 0.55);
    }
    .music-bar__equalizer {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 20px;
      margin-left: auto;
    }
    .music-bar__equalizer span {
      width: 3px;
      height: 5px;
      border-radius: 3px;
      background: #e0b3ff;
      box-shadow: 0 0 6px #a259e6;
    }
    .music-bar.is-playing .music-bar__equalizer span {
      animation: music-equalizer 0.7s ease-in-out infinite alternate;
    }
    .music-bar.is-playing .music-bar__equalizer span:nth-child(2) { animation-delay: 0.15s; }
    .music-bar.is-playing .music-bar__equalizer span:nth-child(3) { animation-delay: 0.3s; }
    .music-bar.is-playing .music-bar__equalizer span:nth-child(4) { animation-delay: 0.45s; }
    @keyframes music-equalizer {
      to { height: 18px; }
    }
    .music-bar audio {
      display: block;
      width: 100%;
      height: 40px;
      accent-color: #a259e6;
    }

    .flower-message {
      position: fixed;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      width: min(420px, calc(100% - 32px));

  <script>
    document.body.classList.remove('not-loaded');
    // Botón para ti: al hacer clic, reproduce música y muestra el resto
    document.getElementById('btn-para-ti').onclick = function() {
      var audio = document.getElementById('audio-para-ti');
      // Reproducir desde el segundo 15. Si no está cargada la metadata, esperar al evento loadedmetadata.
      function playFrom15(a) {
        if (a.readyState > 0) {
          try { a.currentTime = 15; } catch (e) { /* algunos navegadores pueden lanzar si no está permitido */ }
          a.play();
        } else {
          a.addEventListener('loadedmetadata', function() {
            try { a.currentTime = 15; } catch (e) { }
            a.play();
          }, { once: true });
        }
      }

      playFrom15(audio);
      // Oculta pantalla inicial y muestra contenido principal
      document.getElementById('pantalla-inicial').style.display = 'none';
      document.getElementById('contenido-principal').style.display = '';
      // Espera a que terminen las animaciones de los tulipanes (~2.5s)
      setTimeout(function() {
        document.querySelector('.ramo').classList.add('ramo--visible');
      }, 2500);
    };

    var flowerMessages = [
      'Que cada día te regale motivos para sonreír, igual que tú iluminas el mío.',

      'Hay personas que hacen más bonito todo lo que las rodea. Tú eres una de ellas.',

      'Como estas flores, deseo que tu vida siempre encuentre la forma de florecer.',
      'Tu manera de ser tiene esa magia que convierte un momento sencillo en uno especial.',
      'Que esta flor te recuerde lo increíble y única que eres.',

    var flowerDialog = document.querySelector('.flower-message');
    var flowerMessageText = document.getElementById('flower-message-text');

    function openFlowerMessage(flowerHead) {
      var flowers = Array.prototype.slice.call(document.querySelectorAll('.flower__leafs'));
      var flowerIndex = flowers.indexOf(flowerHead);
      if (flowerIndex < 0) return;

      flowerMessageText.textContent = flowerMessages[flowerIndex];
      flowerDialog.showModal();
    }

    document.querySelectorAll('.flower__leafs').forEach(function(flowerHead, index) {
      flowerHead.setAttribute('role', 'button');
      flowerHead.setAttribute('tabindex', '0');
      flowerHead.setAttribute('aria-label', 'Abrir mensaje de la flor ' + (index + 1));
      flowerHead.addEventListener('click', function() {
        openFlowerMessage(flowerHead);
      });
      flowerHead.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openFlowerMessage(flowerHead);
        }
      });
    });

    document.querySelector('.flower-message__close').addEventListener('click', function() {
      flowerDialog.close();

    flowerDialog.addEventListener('click', function(event) {
      if (event.target === flowerDialog) flowerDialog.close();

    });
    musicPlayer.addEventListener('ended', function() {
      musicBar.classList.remove('is-playing');
    });
  </script>
</body>
</html>
