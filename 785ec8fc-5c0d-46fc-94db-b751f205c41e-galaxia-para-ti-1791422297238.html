



<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Galaxia para Luz 💙</title>
  <meta name="description" content="Galaxia interactiva azul dedicada a Luz 🌌">
  <style>
    html, body { margin: 0; height: 100%; background: #00020a; overflow: hidden; }
    #startBtn {
      display: block;
      transition: transform 0.18s cubic-bezier(.4,2,.6,1), box-shadow 0.18s;
      animation: pulseBtn 1.2s infinite cubic-bezier(.4,0,.6,1);
    }
    #startBtn:hover, #startBtn:focus {
      transform: scale(1.09);
      box-shadow: 0 0 32px 8px #70a1ff99, 0 0 0 2px #fff2;
      outline: none;
    }
    @keyframes pulseBtn {
      0% { transform: scale(1); box-shadow: 0 0 0 0 #70a1ff44; }
      60% { transform: scale(1.13); box-shadow: 0 0 32px 8px #70a1ff99; }
      100% { transform: scale(1); box-shadow: 0 0 0 0 #70a1ff44; }
    }
    #galaxy-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .error { position: fixed; inset: auto 10px 20px 10px; background: #001526; color: #d9f0ff; border: 1px solid #8aceff; border-radius: 10px; padding: 10px; font: 12px system-ui; display: none; z-index: 2000; }
  </style>

  <!-- Three.js (r128) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>

<!-- Modal de inicio -->
<div id="startModal" style="position:fixed;inset:0;z-index:1000;background:#020612;display:flex;align-items:center;justify-content:center;flex-direction:column;">
  <button id="startBtn" style="background:none;border:none;outline:none;cursor:pointer;padding:0;">
    <img src="https://i.postimg.cc/1z1zSBRw/snoppie-L.png" alt="Iniciar" style="width:270px;height:270px;display:block;border-radius:20px;border: 3px solid #70a1ff;">
  </button>
</div>

<audio id="bgMusic" src="https://github.com/Baque2005/Organizador/raw/refs/heads/master/Never%20Shout%20Never%20-%20Can't%20Stand%20ItLetra%20en%20espa%C3%B1ol.mp3" preload="auto"></audio>

<canvas id="galaxy-canvas"></canvas>
<div id="err" class="error"></div>
<canvas id="fx" style="position:fixed;inset:0;pointer-events:none;z-index:500;"></canvas>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const modal = document.getElementById('startModal');
  const btn = document.getElementById('startBtn');
  const music = document.getElementById('bgMusic');

  btn.addEventListener('click', function() {
    modal.style.display = 'none';
    music.volume = 0.7;
    const playPromise = music.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {});
    }
    runGalaxy({ cinematic: true });
  });

  function runGalaxy(opts = {}) {
    const err = document.getElementById('err');
    function showError(msg) { err.textContent = msg; err.style.display = 'block'; }

    try { 
      const test = document.createElement('canvas').getContext('webgl') || document.createElement('canvas').getContext('experimental-webgl');
      if (!test) throw new Error('Navegador sin WebGL activo');
    } catch(e) { 
      showError('WebGL desactivado. Activa la aceleración por hardware.'); 
      return; 
    }

    try {
      const canvas = document.getElementById('galaxy-canvas');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; 
      controls.dampingFactor = 0.06;
      controls.minDistance = 10; 
      controls.maxDistance = 220;
      controls.target.set(0, 0, 0);

      let cinematicState = opts.cinematic ? 0 : null;
      let cinematicStart = null;
      const cinematicDuration1 = 2.2;
      const cinematicDuration2 = 3.5;
      const cinematicDuration3 = 2.2;
      const cinematicTotal = cinematicDuration1 + cinematicDuration2 + cinematicDuration3;

      function setCam() {
        const w = window.innerWidth, h = window.innerHeight;
        const isMobile = w < 768 || w < h;
        camera.fov = isMobile ? 90 : 75;
        camera.position.set(0, isMobile ? 26 : 22, isMobile ? 110 : 75);
        camera.updateProjectionMatrix(); 
        controls.update();
      }
      setCam();

      renderer.setClearColor(0x01040f, 1);

      // Explosiones de luz azul
      const explosions = [];
      function spawnExplosion() {
        const geo = new THREE.PlaneGeometry(60, 60);
        const c = document.createElement('canvas');
        c.width = c.height = 256;
        const g = c.getContext('2d');
        const grad = g.createRadialGradient(128, 128, 10, 128, 128, 128);
        grad.addColorStop(0, 'rgba(200,230,255,0.85)');
        grad.addColorStop(0.2, 'rgba(100,180,255,0.45)');
        grad.addColorStop(0.5, 'rgba(30,100,255,0.18)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = grad;
        g.fillRect(0, 0, 256, 256);
        const tex = new THREE.CanvasTexture(c);
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
        const mesh = new THREE.Mesh(geo, mat);
        const angle = Math.random() * Math.PI * 2;
        const dist = 70 + Math.random() * 60;
        mesh.position.set(Math.cos(angle) * dist, (Math.random() - 0.5) * 40, Math.sin(angle) * dist);
        mesh.lookAt(0, 0, 0);
        mesh.material.opacity = 0.85;
        mesh.userData.life = 1.0;
        explosions.push(mesh);
        scene.add(mesh);
      }

      setInterval(() => { if (Math.random() < 0.85) spawnExplosion(); }, 700);

      const galaxy = new THREE.Group(); 
      scene.add(galaxy);

      // Frases personalizadas para Luz
      const phrases = [
        "Luz de mi vida 💙", "Eres mi todo, Luz", "Mi Sol Azul ☀️", "Mi corazón es tuyo", "Luz, mi Cielito 🌌", "Mi Tesoro 💎", "Luz, eres mi Mundo", "Mi Amor Infinito", "Luz, mi Universo 🪐", "Mi estrella azul ✨", "Te amo Luz!!!", "Luz, mi Paz 🌊", "Luz, juntos siempre", "Mi Sueño hecho realidad", "Pensando en ti, Luz", "Mi cielo azul 💙", "Universo de Luz", "Te Admiro tanto", "Te Quiero Mucho Luz", "Luz, eres increíble", "Iluminas mi vida 💡", "Luz, mi lugar feliz", "Eres lo más hermoso", "Te Amo Infinitamente ♾️", "Luz & Yo 💙"
      ];
      const phraseEmojis = ["💙", "🌟", "✨", "💫", "🧿", "🌙", "💙", "💎", "🥰", "🌊", "💞", "🫶", "🪐", "🥹", "💐", "💙", "💎", "🤍", "💓", "💕", "🪐", "🌈", "🩵", "⭐", "🔥"];
      const decoratedPhrases = phrases.map((phrase, index) => `${phrase.trim()} ${phraseEmojis[index % phraseEmojis.length]}`);
      
      const phraseCount = Math.max(phrases.length * 8, 240);
      const arms = 5, radius = 82, maxH = 22;

      function makeTextTexture(text, size = 48) {
        const c = document.createElement('canvas'); 
        c.width = 1024; c.height = 128;
        const g = c.getContext('2d'); 
        g.clearRect(0, 0, c.width, c.height);
        g.font = '800 ' + size + 'px -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial';
        g.textAlign = 'center'; 
        g.textBaseline = 'middle';
        g.shadowColor = 'rgba(70,160,255,0.95)'; 
        g.shadowBlur = 24;
        g.fillStyle = 'rgba(230,245,255,0.98)'; 
        g.fillText(text, c.width / 2, c.height / 2);
        return new THREE.CanvasTexture(c);
      }

      for (let i = 0; i < phraseCount; i++) {
        const perArm = phraseCount / arms; 
        const ang = (i % perArm) * (Math.PI * 2 / perArm);
        const armAng = Math.floor(i / perArm) * (Math.PI * 2 / arms);
        const minDist = radius * 0.2, maxDist = radius * 1.38;
        const dist = minDist + (maxDist - minDist) * (i / phraseCount);
        const thickness = Math.pow(1 - (dist / (radius * 1.38)), 2);
        const x = Math.cos(ang + armAng) * dist;
        const z = Math.sin(ang + armAng) * dist;
        const y = (Math.random() - 0.5) * maxH * thickness * .9;

        const text = decoratedPhrases[i % decoratedPhrases.length];
        const tex = makeTextTexture(text, 48);
        const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
        spr.position.set(x, y, z); 
        spr.scale.set(20, 2.6, 1); 
        galaxy.add(spr);
      }

      // Estrellas azules y blancas
      const starCount = 8000, geom = new THREE.BufferGeometry(), pos = new Float32Array(starCount * 3);
      for (let i = 0; i < starCount; i++) { 
        const ang = Math.random() * Math.PI * 2, dist = Math.random() * radius * 1.15;
        const y = (Math.random() - 0.5) * 36 * Math.pow(1 - Math.min(dist, radius) / radius, 1.5);
        pos[i * 3] = Math.cos(ang) * dist; 
        pos[i * 3 + 1] = y; 
        pos[i * 3 + 2] = Math.sin(ang) * dist; 
      }
      geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      galaxy.add(new THREE.Points(geom, new THREE.PointsMaterial({ color: 0x80c0ff, size: 0.3, transparent: true, opacity: 0.75, blending: THREE.AdditiveBlending })));

      // Núcleo central azul profundo
      const coreR = 12;
      const coreTexCanvas = document.createElement('canvas');
      coreTexCanvas.width = coreTexCanvas.height = 256;
      const cg = coreTexCanvas.getContext('2d');
      const grd = cg.createRadialGradient(128, 128, 10, 128, 128, 128);
      grd.addColorStop(0, '#00d2ff');
      grd.addColorStop(0.5, '#003b99');
      grd.addColorStop(1, '#000826');
      cg.fillStyle = grd;
      cg.arc(128, 128, 128, 0, Math.PI * 2);
      cg.fill();

      const core = new THREE.Mesh(
        new THREE.SphereGeometry(coreR, 64, 64),
        new THREE.MeshPhongMaterial({ map: new THREE.CanvasTexture(coreTexCanvas), shininess: 80, specular: 0x00d2ff })
      );
      scene.add(core);

      const light = new THREE.PointLight(0x00a2ff, 1.5, 200);
      light.position.set(0, 30, 60);
      scene.add(light);

      // Texto 3D "Luz" en el centro
      const textGroup = new THREE.Group();
      scene.add(textGroup);
      const textLoader = new THREE.FontLoader();
      textLoader.load('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_regular.typeface.json', function(font) {
        const textGeometry = new THREE.TextGeometry('Luz 💙', {
          font: font, size: 6, height: 1.8, curveSegments: 12,
          bevelEnabled: true, bevelThickness: 0.2, bevelSize: 0.1, bevelSegments: 4
        });
        textGeometry.computeBoundingBox();
        const bounds = textGeometry.boundingBox;
        textGeometry.translate(
          -(bounds.max.x - bounds.min.x) / 2,
          -(bounds.max.y - bounds.min.y) / 2,
          -(bounds.max.z - bounds.min.z) / 2
        );
        const textMaterial = new THREE.MeshPhongMaterial({
          color: 0xffffff, emissive: 0x0077ff, shininess: 120, specular: 0xa6d8ff
        });
        const textMesh = new THREE.Mesh(textGeometry, textMaterial);
        textMesh.position.set(0, coreR * 1.8, 0);
        textGroup.add(textMesh);
      });

      // Anillo fotónico azul
      const photonRing = new THREE.Mesh(
        new THREE.RingGeometry(coreR * 1.05, coreR * 1.25, 128),
        new THREE.MeshBasicMaterial({ color: 0x40a0ff, transparent: true, opacity: 0.95, side: THREE.DoubleSide })
      );
      photonRing.rotation.x = -Math.PI / 2;
      scene.add(photonRing);

      // Halo azul resplandeciente
      function makeHaloTexture(size = 1024, inner = 0.45) {
        const c = document.createElement('canvas'); c.width = c.height = size;
        const g = c.getContext('2d'); const r = size / 2;
        const grd = g.createRadialGradient(r, r, r * inner, r, r, r);
        grd.addColorStop(0.0, 'rgba(0,180,255,0.6)');
        grd.addColorStop(0.35, 'rgba(0,100,255,0.38)');
        grd.addColorStop(0.7, 'rgba(0,40,180,0.2)');
        grd.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = grd; g.fillRect(0, 0, size, size);
        return new THREE.CanvasTexture(c);
      }
      const haloPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(320, 320),
        new THREE.MeshBasicMaterial({ map: makeHaloTexture(), transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0.9 })
      );
      haloPlane.rotation.x = -Math.PI / 2;
      scene.add(haloPlane);

      function animate() {
        requestAnimationFrame(animate);
        const t = performance.now() * 0.001;

        if (cinematicState !== null) {
          if (cinematicStart === null) cinematicStart = t;
          const elapsed = t - cinematicStart;
          if (elapsed < cinematicDuration1) {
            const prog = elapsed / cinematicDuration1;
            camera.position.lerpVectors(new THREE.Vector3(0, 0, 220), new THREE.Vector3(0, 18, 38), prog);
            camera.lookAt(0, 0, 0);
            controls.enabled = false;
          } else if (elapsed < cinematicDuration1 + cinematicDuration2) {
            const prog = (elapsed - cinematicDuration1) / cinematicDuration2;
            const angle = Math.PI / 2 + prog * Math.PI * 2 * 0.85;
            camera.position.x = Math.cos(angle) * 38;
            camera.position.y = 18;
            camera.position.z = Math.sin(angle) * 38;
            camera.lookAt(0, 0, 0);
            controls.enabled = false;
          } else if (elapsed < cinematicTotal) {
            const prog = (elapsed - cinematicDuration1 - cinematicDuration2) / cinematicDuration3;
            const startAngle = Math.PI / 2 + Math.PI * 2 * 0.85;
            camera.position.x = Math.cos(startAngle) * (38 + (220 - 38) * prog);
            camera.position.y = 18 + (80 - 18) * prog;
            camera.position.z = Math.sin(startAngle) * (38 + (220 - 38) * prog);
            camera.lookAt(0, 0, 0);
            controls.enabled = false;
          } else {
            controls.enabled = true;
            cinematicState = null;
          }
        }

        galaxy.rotation.y = t * 0.05;
        core.rotation.y = t * 0.12;
        photonRing.rotation.z = t * 0.18;
        haloPlane.rotation.z = t * 0.02;
        textGroup.rotation.y = t * 0.25;

        for (let i = explosions.length - 1; i >= 0; i--) {
          const e = explosions[i];
          e.material.opacity *= 0.94;
          e.userData.life -= 0.018;
          if (e.userData.life <= 0.05) {
            scene.remove(e);
            explosions.splice(i, 1);
          }
        }

        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Corazones azules interactivos
      const fx = document.getElementById('fx');
      const ctx2 = fx.getContext('2d');
      function resizeFx() {
        fx.width = Math.floor(innerWidth * Math.min(2, window.devicePixelRatio || 1));
        fx.height = Math.floor(innerHeight * Math.min(2, window.devicePixelRatio || 1));
        fx.style.width = innerWidth + 'px';
        fx.style.height = innerHeight + 'px';
      }
      window.addEventListener('resize', resizeFx); 
      resizeFx();

      const DPR = Math.min(2, window.devicePixelRatio || 1);
      const hearts = [];
      function spawnHearts(x, y, n = 20) {
        x *= DPR; y *= DPR;
        for (let i = 0; i < n; i++) { 
          const a = Math.random() * Math.PI * 2;
          hearts.push({ x, y, vx: Math.cos(a) * (0.6 + Math.random() * 0.8), vy: -(0.8 + Math.random() * 1.2), life: 1, size: 10 + Math.random() * 16 });
        }
      }

      function drawHeart(x, y, size) {
        const s = size; 
        ctx2.save(); 
        ctx2.translate(x, y);
        ctx2.beginPath(); 
        ctx2.moveTo(0, -0.25 * s);
        ctx2.bezierCurveTo(.5 * s, -.9 * s, 1.4 * s, -.1 * s, 0, .9 * s);
        ctx2.bezierCurveTo(-1.4 * s, -.1 * s, -.5 * s, -.9 * s, 0, -0.25 * s);
        const g = ctx2.createRadialGradient(0, 0, 0, 0, 0, s);
        g.addColorStop(0, 'rgba(180,220,255,.95)'); 
        g.addColorStop(1, 'rgba(0,120,255,0)');
        ctx2.fillStyle = g; 
        ctx2.fill(); 
        ctx2.restore();
      }

      let lastTap = 0;
      window.addEventListener('click', (e) => { 
        const now = performance.now(); 
        if (now - lastTap < 320) spawnHearts(e.clientX, e.clientY, 20); 
        lastTap = now; 
      }, { passive: true });

      window.addEventListener('touchend', (e) => { 
        const now = performance.now(); 
        const t = e.changedTouches && e.changedTouches[0]; 
        if (now - lastTap < 320 && t) spawnHearts(t.clientX, t.clientY, 20); 
        lastTap = now; 
      }, { passive: true });

      function loopFx() {
        ctx2.clearRect(0, 0, fx.width, fx.height);
        for (let i = hearts.length - 1; i >= 0; i--) { 
          const h = hearts[i]; 
          h.x += h.vx; h.y += h.vy; 
          h.vy -= 0.02; 
          h.life -= 0.015;
          ctx2.globalAlpha = Math.max(0, h.life); 
          drawHeart(h.x, h.y, h.size); 
          ctx2.globalAlpha = 1; 
          if (h.life <= 0) hearts.splice(i, 1);
        }
        requestAnimationFrame(loopFx);
      } 
      loopFx();

    } catch(e) { 
      showError('Error al renderizar la galaxia: ' + e.message); 
      console.error(e); 
    }
  }
});
</script>
</body>
</html>
